on:
  push:
    branches: [master]

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # lfs: false so an exhausted LFS budget can't fail the checkout and
          # block the whole deploy. LFS objects are pulled best-effort below.
          lfs: false

      - name: Best-effort LFS pull (never fail the build)
        continue-on-error: true
        run: |
          # Try to materialise LFS binaries (Mainz 2024 TAVI images/PDFs).
          # If the LFS budget is exhausted this exits non-zero, but the
          # `|| echo` + continue-on-error keep the deploy alive — those few
          # pages render with placeholder images until the budget is restored.
          git lfs install --local || true
          git lfs pull || echo "::warning::LFS pull skipped (budget exhausted/unavailable); LFS-backed images may be missing in this build."

      - name: Symlink images into Mainz 2024 Quarto project
        # Locally this is a Windows junction (gitignored). On the runner we
        # recreate it as a POSIX symlink so Quarto can resolve ../images/ refs
        # inside the project from quarto/zh/ and quarto/en/.
        run: |
          ln -s ../images handouts/04-valvular-disease/mainz-2024/quarto/images
          ls -la handouts/04-valvular-disease/mainz-2024/quarto/ | grep images

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
