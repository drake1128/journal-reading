on:
  push:
    branches: [master]

name: Quarto Publish

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Symlink images into Mainz 2024 Quarto project
        # Locally this is a Windows junction (gitignored). On the runner we
        # recreate it as a POSIX symlink so Quarto can resolve ../images/ refs
        # inside the project from quarto/zh/ and quarto/en/.
        run: |
          ln -s ../images handouts/04-valvular-disease/mainz-2024/quarto/images
          ls -la handouts/04-valvular-disease/mainz-2024/quarto/ | grep images

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
