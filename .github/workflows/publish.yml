on:
  push:
    branches: [master]

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Symlink images into Mainz 2024 Quarto project
        # Locally this is a Windows junction (gitignored). On the runner we
        # recreate it as a POSIX symlink so Quarto can resolve ../images/ refs
        # inside the project from quarto/zh/ and quarto/en/.
        run: |
          ln -s ../images handouts/04-valvular-disease/mainz-2024/quarto/images
          ls -la handouts/04-valvular-disease/mainz-2024/quarto/ | grep images

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
