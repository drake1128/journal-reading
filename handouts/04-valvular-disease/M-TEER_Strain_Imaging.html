<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M-TEER 後的 Strain Imaging 實作教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#c0392b; --accent-light:#e74c3c;
  --success:#27ae60; --warning:#f39c12; --info:#2980b9;
  --bg-cream:#faf8f5; --bg-card:#ffffff; --text-dark:#2c3e50; --text-muted:#7f8c8d;
  --border:#e6e9ec; --shadow:0 4px 20px rgba(0,0,0,.08);
}
:root.dark-theme{
  --bg-cream:#141b26; --bg-card:#1c2634; --text-dark:#e8eaed; --text-muted:#9aa5b1;
  --border:#2d3748; --shadow:0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  background:var(--bg-cream);color:var(--text-dark);line-height:1.75;font-size:15.5px;}
#root{max-width:820px;margin:0 auto;}
.app{padding:0 14px 96px;padding-bottom:calc(96px + env(safe-area-inset-bottom));}

/* Header */
.hdr{background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;margin:0 -14px 16px;padding:20px 18px 18px;border-radius:0 0 20px 20px;}
.hdr .tag{display:inline-block;background:rgba(255,255,255,.18);padding:3px 10px;
  border-radius:20px;font-size:11.5px;letter-spacing:.4px;margin-bottom:8px;}
.hdr h1{margin:0 0 4px;font-size:20px;font-weight:700;line-height:1.4;}
.hdr p{margin:0;font-size:12.5px;opacity:.88;}
.theme-btn{position:absolute;right:20px;top:20px;background:rgba(255,255,255,.2);border:0;
  color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;}
.hdr-wrap{position:relative;}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  z-index:50;box-shadow:0 -2px 14px rgba(0,0,0,.06);}
.nav button{flex:1;background:none;border:0;color:var(--text-muted);font-size:10.5px;
  font-family:inherit;padding:6px 2px;min-height:48px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;border-radius:10px;}
.nav button.on{color:var(--accent);font-weight:600;background:rgba(192,57,43,.07);}
.nav .ico{font-size:17px;line-height:1;}

/* Cards */
.card{background:var(--bg-card);border-radius:14px;padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);border:1px solid var(--border);}
.card h2{margin:0 0 10px;font-size:17px;color:var(--primary);font-weight:700;
  display:flex;align-items:center;gap:8px;}
:root.dark-theme .card h2{color:#7fb2e8;}
.card h3{margin:16px 0 8px;font-size:15px;color:var(--accent);font-weight:600;}
.card p{margin:0 0 10px;}
.sub{font-size:12.5px;color:var(--text-muted);margin-top:-4px;margin-bottom:12px;}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;
  background:var(--border);color:var(--text-dark);margin-right:6px;font-weight:500;}
.badge.red{background:rgba(192,57,43,.12);color:var(--accent);}
.badge.green{background:rgba(39,174,96,.14);color:var(--success);}
.badge.blue{background:rgba(41,128,185,.14);color:var(--info);}
.badge.amber{background:rgba(243,156,18,.16);color:#b9770e;}

.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px;}
.kv:last-child{border-bottom:0;}
.kv b{font-weight:600;color:var(--primary);white-space:nowrap;}
:root.dark-theme .kv b{color:#7fb2e8;}

.note{border-left:4px solid var(--info);background:rgba(41,128,185,.07);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.8px;}
.warn{border-left:4px solid var(--warning);background:rgba(243,156,18,.09);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.8px;}
.danger{border-left:4px solid var(--accent);background:rgba(192,57,43,.07);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.8px;}
.note b,.warn b,.danger b{display:block;margin-bottom:3px;}

table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 4px;}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--border);}
th:first-child,td:first-child{text-align:left;}
th{background:rgba(30,58,95,.06);color:var(--primary);font-weight:600;font-size:12.5px;}
:root.dark-theme th{background:rgba(127,178,232,.12);color:#7fb2e8;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
td.num{font-variant-numeric:tabular-nums;}

/* Steps */
.step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);}
.step:last-child{border-bottom:0;}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px;}
.step .b{flex:1;}
.step .b strong{display:block;font-size:14.5px;margin-bottom:2px;}
.step .b span{font-size:13.5px;color:var(--text-muted);display:block;}

/* Checklist */
.ck{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;margin-bottom:8px;
  background:var(--bg-cream);border:1px solid var(--border);border-radius:11px;
  min-height:48px;cursor:pointer;transition:.15s;font-size:14px;}
.ck.on{background:rgba(39,174,96,.1);border-color:rgba(39,174,96,.4);}
.ck .box{flex:0 0 21px;height:21px;border:2px solid var(--text-muted);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-top:1px;}
.ck.on .box{background:var(--success);border-color:var(--success);}
.prog{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin:6px 0 14px;}
.prog i{display:block;height:100%;background:var(--success);transition:.3s;}

/* Accordion */
.acc{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--bg-card);}
.acc>button{width:100%;text-align:left;background:none;border:0;font-family:inherit;
  font-size:14.5px;font-weight:600;color:var(--text-dark);padding:13px 14px;min-height:48px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
.acc .body{padding:0 14px 14px;font-size:14px;border-top:1px solid var(--border);padding-top:12px;}
.acc .arrow{color:var(--accent);font-size:13px;}

ul.tight{margin:6px 0 6px 2px;padding-left:18px;}
ul.tight li{margin-bottom:6px;font-size:14px;}
.en{color:var(--text-muted);font-size:.92em;}

/* Quiz */
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;
  background:var(--bg-cream);border:1.5px solid var(--border);border-radius:11px;
  font-family:inherit;font-size:14px;color:var(--text-dark);min-height:48px;cursor:pointer;}
.opt.correct{background:rgba(39,174,96,.14);border-color:var(--success);}
.opt.wrong{background:rgba(192,57,43,.1);border-color:var(--accent);}
.btn{background:var(--primary);color:#fff;border:0;border-radius:11px;padding:12px 18px;
  font-family:inherit;font-size:14.5px;font-weight:600;min-height:48px;cursor:pointer;width:100%;}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}

svg{max-width:100%;height:auto;display:block;}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-muted);margin-top:8px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px;}
.foot{font-size:12px;color:var(--text-muted);text-align:center;padding:8px 4px 0;line-height:1.9;}
.foot b{color:var(--text-dark);display:block;font-size:13px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

/* ============ 資料 ============ */

const NAV = [
  {id:'home', ico:'🏠', label:'Take Home'},
  {id:'why',  ico:'📈', label:'為什麼做'},
  {id:'how',  ico:'🎯', label:'怎麼做'},
  {id:'pit',  ico:'⚠️', label:'陷阱'},
  {id:'data', ico:'📊', label:'本研究'},
  {id:'quiz', ico:'✏️', label:'測驗'},
];

const NORMALS = [
  ['LV GLS', '≈ −20%（−16 ~ −22%）', '絕對值 <16% 為異常；報告請帶負號'],
  ['LA reservoir strain (LARS)', '≈ 35–40%', '<23% 明顯異常；<18% 屬嚴重受損'],
  ['LA conduit (LAScd)', '≈ −18 ~ −22%（負值）', 'R-R gating 下為負向段'],
  ['LA contractile (LASct)', '≈ −14 ~ −17%（負值）', 'AF 病人不存在此段'],
  ['RV free wall strain (RV-FWS)', '絕對值 >20%', '<17% 為異常；勿把 septum 算進去'],
  ['LAVI', '<34 mL/m²', '本研究 baseline 55 ± 14，屬重度擴大'],
];

const T3 = [
  ['LVEF, %','42 ± 11','43 ± 10','43 ± 10','0.41'],
  ['LVEDV, mL','182 ± 48','170 ± 45','165 ± 43','<0.001'],
  ['LVESV, mL','104 ± 39','98 ± 35','94 ± 36','<0.001'],
  ['LAVI, mL/m²','55 ± 14','49 ± 13','46 ± 12','<0.001'],
  ['PASP, mmHg','48 ± 12','41 ± 11','38 ± 10','<0.001'],
  ['LV GLS, %','−11.8 ± 3.2','−13.6 ± 3.1','−14.1 ± 3.3','<0.001'],
  ['RV-FWS, %','−15.4 ± 4.1','−17.1 ± 4.0','−18.2 ± 4.3','<0.001'],
  ['LARS, %','13.2 ± 5.1','18.6 ± 5.4','21.1 ± 5.9','<0.001'],
];

const T4 = [
  ['ΔLV GLS vs NYHA improvement','0.42 (0.24–0.58)','<0.001'],
  ['ΔLV GLS vs ΔKCCQ-OS','0.39 (0.20–0.55)','<0.001'],
  ['ΔLARS vs NYHA improvement','0.48 (0.31–0.62)','<0.001'],
  ['ΔLARS vs ΔKCCQ-OS','0.51 (0.34–0.65)','<0.001'],
  ['ΔRV-FWS vs NYHA improvement','0.34 (0.15–0.51)','0.001'],
  ['ΔRV-FWS vs ΔKCCQ-OS','0.36 (0.17–0.52)','<0.001'],
  ['ΔLV GLS → ΔKCCQ-OS','2.6','0.002'],
  ['ΔLARS → ΔKCCQ-OS','1.9','<0.001'],
  ['ΔRV-FWS → ΔKCCQ-OS','1.5','0.002'],
];

const T1 = [
  ['Age, years','73 (67–78)','75 (69–80)','71 (66–77)','0.048'],
  ['Female, n (%)','41 (44.6)','14 (50.0)','27 (42.2)','0.48'],
  ['Diabetes mellitus','31 (33.7)','5 (17.9)','26 (40.6)','0.03'],
  ['AF / flutter','48 (52.2)','17 (60.7)','31 (48.4)','0.27'],
  ['Prior MI','29 (31.5)','4 (14.3)','25 (39.1)','0.02'],
  ['NYHA IV','68 (73.9)','19 (67.9)','49 (76.6)','0.38'],
  ['NT-proBNP, pg/mL','2560 (1600–4300)','1950 (1300–3100)','2920 (1900–4850)','0.02'],
  ['EuroSCORE II, %','5.7 (3.9–8.0)','4.9 (3.3–6.9)','6.2 (4.4–8.5)','0.03'],
  ['MR grade 4+','56 (60.9)','17 (60.7)','39 (60.9)','0.98'],
  ['EROA, mm²','42 ± 12','45 ± 13','40 ± 11','0.047'],
  ['LVEF, %','42 ± 11','51 ± 8','38 ± 10','<0.001'],
  ['LAVI, mL/m²','55 ± 14','47 ± 12','59 ± 14','<0.001'],
  ['TAPSE, mm','17.6 ± 3.4','19.6 ± 3.2','16.8 ± 3.2','<0.001'],
  ['PASP, mmHg','48 ± 12','40 ± 10','52 ± 12','<0.001'],
];

const QUIZ = [
  {q:'測量 LA strain 時，EACVI/ASE/Industry Task Force 建議的 zero-reference（歸零點）是？',
   o:['P 波起點（P-P gating）','R 波上升支（R-R gating）','二尖瓣開啟時刻','主動脈瓣關閉時刻 (AVC)'],
   c:1, e:'共識建議以 R 波上升支為 zero reference（R-R gating），在各種節律（含 AF）下一致性與再現性較佳。P-P gating 雖能更貼近心房收縮，但需要乾淨的 P 波，AF 病人不適用。'},
  {q:'替一位 M-TEER 術後、LAVI 55 mL/m² 的病人量 LARS，最常見的技術錯誤是？',
   o:['直接沿用測 LV GLS 的 apical 4C 影像','frame rate 設太高','使用同一台機器追蹤','屏氣在吐氣末'],
   c:0, e:'LV-focused 的 apical view 為了把心尖放好，常把擴大的 LA 切掉或 foreshorten。LA strain 必須另外抓 LA-focused apical 4C 與 2C（加大深度／調整角度讓整個 LA 入鏡），否則 LARS 會被系統性低估。'},
  {q:'關於 RV free wall strain (RV-FWS) 的節段選取，正確的是？',
   o:['取 RV 游離壁 + interventricular septum 共 6 節段平均','只取 RV 游離壁 basal / mid / apical 3 節段',
       '只取 basal 節段','取 RV 游離壁 + RA 側壁'],
   c:1, e:'RV-FWS 只平均游離壁的 basal、mid、apical 三個節段。若把 septum 一起平均即為 RV global longitudinal strain，兩者數值不同、正常值也不同，報告必須註明用的是哪一個。'},
  {q:'本次 ESC 2026 報告中，1 年 LVEF 由 42% → 43%（p trend = 0.41），但 LV GLS 由 −11.8% → −14.1%（p<0.001）。最合理的解讀是？',
   o:['GLS 一定是量錯了','LVEF 對 MR 矯正後的心肌功能變化較不敏感','病人心肌其實惡化','兩個參數必須一致才可信'],
   c:1, e:'MR 減少後 preload 下降、afterload 上升，LVEF 常「看起來沒進步」甚至下降；GLS 為較敏感的長軸收縮指標，能偵測到 EF 抓不到的 chamber-level recovery。這正是強調 deformation imaging 的核心論點。'},
  {q:'一位 permanent AF 病人要做 serial strain 追蹤，最合適的做法是？',
   o:['只取一個 beat，選 RR 最長的','平均至少 3–5 個心跳（或用 index-beat 法：前一個 RR ≈ 前前一個 RR）',
       '改用 3D EF 取代 strain','等轉為 sinus rhythm 再測'],
   c:1, e:'AF 因 beat-to-beat 變異大，建議平均 ≥3–5 個連續心跳，或採 index-beat 法挑選 RR 前後相近的心跳。另外 AF 病人沒有 LASct（心房收縮期），只報 LASr（與 LAScd）。'},
  {q:'關於 serial strain 追蹤的品質控管，下列何者最重要？',
   o:['每次可換不同廠牌機器以互相驗證','baseline 與追蹤使用同一廠牌、同版本軟體、盡量同一操作者',
       '只要 LVEF 一致即可','只要影像清楚，廠牌不重要'],
   c:1, e:'不同廠牌／版本之間 GLS 與 LA strain 存在系統性差異（LA strain 絕對值差可達 2–4%）。序列比較必須固定平台與軟體版本，否則「進步」可能只是換機器造成的假象。'},
  {q:'本研究（單中心 92 例、無對照組）Table 4 顯示 ΔLARS 與 ΔKCCQ-OS 相關（0.51, p<0.001）。最恰當的結論是？',
   o:['證明 LARS 改善「導致」症狀改善','兩者存在關聯，但無法推論因果',
       '可用來取代 KCCQ 問卷','代表 M-TEER 優於藥物治療'],
   c:1, e:'這是單臂觀察性研究，只能說 association。投影片上這幾個 effect estimate 也未標示單位（相關係數 vs 迴歸係數），引用前應回查全文。要談因果或與 GDMT 比較，需要 randomized 設計。'},
  {q:'M-TEER 術後做 strain，下列哪一項是這個族群「特有」的技術陷阱？',
   o:['clip 造成的 acoustic shadow / dropout 影響基部節段追蹤','需要屏氣','需要好的 ECG 訊號','需要足夠 frame rate'],
   c:0, e:'clip 的金屬回音與 shadowing 常干擾 basal inferoseptal / anterolateral 節段的 speckle tracking；此外 transseptal 後的 iASD 會改變 RV 負荷、殘餘 MR 與 iatrogenic MS 也會改變 loading，判讀時都要一併記錄。'},
];

const CK_ITEMS = [
  {id:'c1', t:'影像已用高 frame rate 擷取（40–80 fps；frame rate ÷ heart rate ≈ 0.7–0.9）'},
  {id:'c2', t:'ECG 訊號乾淨、R 波可辨識，無干擾雜訊'},
  {id:'c3', t:'吐氣末屏氣，影像無明顯 translational motion'},
  {id:'c4', t:'apical views 無 foreshortening（LV 長軸取到最長）'},
  {id:'c5', t:'LA strain 使用另外擷取的 LA-focused 4C / 2C（非沿用 LV view）'},
  {id:'c6', t:'RV-FWS 使用 RV-focused apical 4C，只取游離壁 3 節段'},
  {id:'c7', t:'sinus rhythm 存 3 個心跳；AF 存 ≥5 個心跳供平均'},
  {id:'c8', t:'ROI 寬度貼合心肌厚度；LA 用薄 ROI，並排除 LAA 與肺靜脈開口'},
  {id:'c9', t:'GLS 已用 APLAX 的 AVC timing 定義 end-systole'},
  {id:'c10',t:'逐節段目視確認追蹤品質，剔除追蹤不良節段（單一 view >2 節段失敗則整段捨棄）'},
  {id:'c11',t:'與 baseline 使用相同廠牌、相同軟體版本'},
  {id:'c12',t:'同步記錄殘餘 MR grade、mean transmitral gradient、心律、血壓'},
];

/* ============ 小元件 ============ */

const Acc = ({title, badge, children, open0}) => {
  const [o,setO] = useState(!!open0);
  return (
    <div className="acc">
      <button onClick={()=>setO(!o)}>
        <span>{title} {badge && <span className={'badge '+badge.c}>{badge.t}</span>}</span>
        <span className="arrow">{o?'▲':'▼'}</span>
      </button>
      {o && <div className="body">{children}</div>}
    </div>
  );
};

const Steps = ({items}) => (
  <div>{items.map((s,i)=>(
    <div className="step" key={i}>
      <div className="n">{i+1}</div>
      <div className="b"><strong>{s[0]}</strong><span>{s[1]}</span></div>
    </div>
  ))}</div>
);

/* 堆疊長條圖 */
const StackBar = ({title, cats, series, colors, labels}) => {
  const W=320,H=180,pad=28,bw=52,gap=(W-pad-14-bw*cats.length)/(cats.length-1||1);
  return (
    <div>
      <div style={{fontSize:'13.5px',fontWeight:600,marginBottom:'6px'}}>{title}</div>
      <svg viewBox={`0 0 ${W} ${H}`}>
        {[0,25,50,75,100].map(v=>(
          <g key={v}>
            <line x1={pad} x2={W-8} y1={H-24-(v/100)*(H-46)} y2={H-24-(v/100)*(H-46)}
              stroke="var(--border)" strokeWidth="1" strokeDasharray="3 3"/>
            <text x={pad-4} y={H-21-(v/100)*(H-46)} fontSize="8" fill="var(--text-muted)" textAnchor="end">{v}</text>
          </g>
        ))}
        {cats.map((c,ci)=>{
          let acc=0;
          return (
            <g key={ci}>
              {series.map((s,si)=>{
                const v=s[ci]; if(!v) return null;
                const h=(v/100)*(H-46); const y=H-24-acc-h; acc+=h;
                return (
                  <g key={si}>
                    <rect x={pad+6+ci*(bw+gap)} y={y} width={bw} height={h} fill={colors[si]} rx="2"/>
                    {v>=8 && <text x={pad+6+ci*(bw+gap)+bw/2} y={y+h/2+3} fontSize="8.5"
                      fill="#fff" textAnchor="middle" fontWeight="600">{v}%</text>}
                  </g>
                );
              })}
              <text x={pad+6+ci*(bw+gap)+bw/2} y={H-10} fontSize="9" fill="var(--text-muted)" textAnchor="middle">{c}</text>
            </g>
          );
        })}

/* 17/18 節段 bullseye 示意 */
const polar=(cx,cy,r,a)=>{const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t), cy+r*Math.sin(t)];};
const sector=(cx,cy,r1,r2,a1,a2)=>{
  const [x1,y1]=polar(cx,cy,r2,a2),[x2,y2]=polar(cx,cy,r2,a1),
        [x3,y3]=polar(cx,cy,r1,a1),[x4,y4]=polar(cx,cy,r1,a2);
  const lg=(a2-a1)<=180?0:1;
  return `M${x1} ${y1} A${r2} ${r2} 0 ${lg} 0 ${x2} ${y2} L${x3} ${y3} A${r1} ${r1} 0 ${lg} 1 ${x4} ${y4} Z`;
};

        建議各單位以自家平台建立內部參考範圍，勿直接跨平台套用 cut-off。
      </p>
    </div>
  </div>
  );
};

const Pit = () => (
  <div>
    <div className="card">

        <p><b>後果：</b>LA foreshortening → LARS 系統性低估，且 baseline 與追蹤的低估程度不一致 → Δ 不可信。</p>
        <p><b>破解：</b>把「LA-focused 4C / 2C」寫進 protocol 的固定影像清單，讓技術員在同一次檢查一定會存到。</p>
      </Acc>
      <Acc title="② 換機器 / 換軟體版本做序列比較" badge={{c:'red',t:'致命'}}>
        <p><b>後果：</b>inter-vendor 差異可能大於真正的生物性變化，「進步」變成假象。</p>
        <p><b>破解：</b>在報告固定欄位註明廠牌與版本；同一病人的追蹤盡量綁定同一台機器。</p>

        <p><b>破解：</b>逐節段目視確認；追蹤不良就剔除，並在報告註明可分析節段數。</p>
      </Acc>
      <Acc title="④ 忽略負荷條件的改變" badge={{c:'amber',t:'解讀'}}>
        <p><b>後果：</b>把負荷變化誤判為心肌功能變化。MR 減少後 preload ↓、afterload ↑。</p>
        <p><b>破解：</b>每次 strain 都同步記錄殘餘 MR grade、transmitral gradient、血壓、心率、節律。</p>

        <p><b>後果：</b>beat-to-beat 變異讓數值飄動可達數個百分點。</p>
        <p><b>破解：</b>平均 ≥3–5 個心跳，或用 index-beat 法。AF 不報 LASct。</p>

        <p><b>破解：</b>把 volumes ＋ strain 一起放進追蹤報告。</p>
      </Acc>
      <Acc title="⑦ 把 RV global strain 當成 RV free wall strain" badge={{c:'blue',t:'定義'}}>

      </Acc>
      <Acc title="⑧ 把 association 說成 causation" badge={{c:'red',t:'文獻判讀'}}>

        <p><b>破解：</b>對外報告時明確講：「deformation 恢復與症狀改善<b>相關</b>」，

    </div>

const Quiz = () => {
  const [i,setI]=useState(0),[sel,setSel]=useState(null),[show,setShow]=useState(false),
        [score,setScore]=useState(0),[fin,setFin]=useState(false);
  const q=QUIZ[i];
  const pick=(k)=>{ if(show) return; setSel(k); setShow(true); if(k===q.c) setScore(s=>s+1); };
  const next=()=>{ if(i<QUIZ.length-1){setI(i+1);setSel(null);setShow(false);} else setFin(true); };
  const reset=()=>{setI(0);setSel(null);setShow(false);setScore(0);setFin(false);};

  if(fin) return (
    <div className="card" style={{textAlign:'center'}}>
      <h2 style={{justifyContent:'center'}}>🎉 完成</h2>
      <p style={{fontSize:'34px',fontWeight:700,color:'var(--accent)',margin:'10px 0'}}>{score} / {QUIZ.length}</p>
      <p className="sub">{score===QUIZ.length?'滿分，可以帶 fellow 上機了。'
        :score>=QUIZ.length*0.7?'不錯，建議再看一次「怎麼做」與「陷阱」。'
        :'建議重讀「怎麼做」章節的三個腔室 SOP。'}</p>
      <button className="btn" onClick={reset}>再測一次</button>
    </div>
  );

  return (
    <div className="card">
      <div className="prog"><i style={{width:((i)/QUIZ.length*100)+'%'}}></i></div>
      <p className="sub">第 {i+1} 題 / 共 {QUIZ.length} 題 　目前 {score} 分</p>
      <p style={{fontWeight:600,fontSize:'15.5px'}}>{q.q}</p>
      {q.o.map((o,k)=>(
        <button key={k} className={'opt '+(show?(k===q.c?'correct':(k===sel?'wrong':'')):'')}
          onClick={()=>pick(k)}>{String.fromCharCode(65+k)}. {o}</button>
      ))}
      {show && <div className={sel===q.c?'note':'danger'} style={{marginTop:'12px'}}>
        <b>{sel===q.c?'✅ 正確':'❌ 再看一次'}</b>{q.e}
        <button className="btn" style={{marginTop:'12px'}} onClick={next}>
          {i<QUIZ.length-1?'下一題':'看結果'}</button>
      </div>}
    </div>
  );
};
