<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Syncope-Stopper 與 DROP Score｜讀書會共筆</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#e74c3c; --accent-light:#ff6b5b;
  --success:#27ae60; --warning:#f39c12; --bg-cream:#faf8f5; --bg-card:#ffffff;
  --text-dark:#2c3e50; --text-muted:#7f8c8d; --border:#ecf0f1; --shadow:0 4px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg-cream);color:var(--text-dark);line-height:1.75;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 110px;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:22px 16px 18px;border-radius:0 0 20px 20px}
header .eyebrow{font-size:12px;letter-spacing:2px;opacity:.8}
header h1{margin:6px 0 4px;font-size:21px;line-height:1.35;font-weight:700}
header .sub{font-size:13px;opacity:.9}
.badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 11px;font-size:11.5px;margin:8px 6px 0 0}
.card{background:var(--bg-card);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin:14px 0;border:1px solid var(--border)}
.card h2{font-size:17px;margin:0 0 10px;color:var(--primary);border-left:4px solid var(--accent);padding-left:9px}
.card h3{font-size:15px;margin:16px 0 6px;color:var(--primary-light)}
p{margin:8px 0}
.takehome{background:linear-gradient(135deg,#fff8f0,#fff);border-left:5px solid var(--accent)}
.th-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.th-item:last-child{border-bottom:none}
.th-num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
.th-txt{font-size:14.5px}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 30%;min-width:98px;background:var(--primary);color:#fff;border-radius:11px;padding:11px 8px;text-align:center}
.stat .v{font-size:19px;font-weight:700;color:#ffd97a}
.stat .l{font-size:11px;opacity:.9;line-height:1.4}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
th{background:var(--primary);color:#fff;padding:8px 6px;text-align:left;font-weight:500;font-size:12.5px}
td{padding:7px 6px;border-bottom:1px solid var(--border)}
tr.hl td{background:#fff8e1;font-weight:500}
tr.hl2 td{background:#fdeef0}
.note{background:#f4f7fb;border-left:4px solid var(--primary-light);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin:12px 0}
.warn{background:#fff6ec;border-left:4px solid var(--warning);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin:12px 0}
.danger{background:#fdeef0;border-left:4px solid var(--accent);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin:12px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;box-shadow:0 -3px 16px rgba(0,0,0,.07);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:8px 2px 9px;font-family:inherit;font-size:10.5px;color:var(--text-muted);min-height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--accent);font-weight:700}
nav .dot{width:6px;height:6px;border-radius:50%;background:transparent}
nav button.on .dot{background:var(--accent)}
.drop-letter{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:11px;background:#f7f9fc;margin-bottom:9px;border:1px solid var(--border)}
.dl-big{flex:0 0 40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dl-t{font-size:14.5px;font-weight:700;color:var(--primary)}
.dl-s{font-size:13px;color:var(--text-muted);line-height:1.6}
.calc-item{display:flex;align-items:center;gap:11px;padding:12px;border:2px solid var(--border);border-radius:11px;margin-bottom:9px;cursor:pointer;min-height:56px;transition:.15s;background:#fff}
.calc-item.sel{border-color:var(--accent);background:#fff5f4}
.cbox{flex:0 0 24px;height:24px;border-radius:6px;border:2px solid #cfd8dc;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.calc-item.sel .cbox{background:var(--accent);border-color:var(--accent)}
.calc-item .ct{font-size:14px;line-height:1.5}
.calc-item .cs{font-size:12px;color:var(--text-muted)}
.score-box{border-radius:13px;padding:15px;text-align:center;color:#fff;margin-top:12px}
.score-box .n{font-size:36px;font-weight:700;line-height:1}
.score-box .d{font-size:13.5px;margin-top:7px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;padding:13px;margin-bottom:9px;border:2px solid var(--border);border-radius:11px;background:#fff;font-family:inherit;font-size:14.5px;min-height:50px;cursor:pointer;color:var(--text-dark)}
.opt.correct{border-color:var(--success);background:#eafaf1}
.opt.wrong{border-color:var(--accent);background:#fdeef0}
.opt:disabled{opacity:.85}
.pbar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:12px}
.pbar div{height:100%;background:var(--accent);transition:.3s}
.btn{background:var(--primary);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-family:inherit;font-size:14.5px;min-height:48px;cursor:pointer;width:100%;margin-top:11px;font-weight:500}
.exp{background:#f4f7fb;border-radius:10px;padding:12px;margin-top:11px;font-size:13.5px}
.km{width:100%;height:auto}
footer{font-size:11.5px;color:var(--text-muted);text-align:center;padding:18px 6px;line-height:1.9}
.sig{background:#fff;border-radius:14px;padding:15px;text-align:center;border:1px solid var(--border);font-size:13.5px;line-height:2}
.sig b{color:var(--primary)}
.tag{display:inline-block;background:#eef3f9;color:var(--primary-light);border-radius:99px;padding:2px 10px;font-size:11.5px;margin:2px}
ul{padding-left:20px;margin:8px 0}
li{margin:5px 0;font-size:14px}
.small{font-size:12.5px;color:var(--text-muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ---------------- DROP 計算器 ---------------- */
const DROP_ITEMS = [
  {id:'D', t:'D — Distal conduction disease', s:'遠端傳導系統疾病：bundle branch block、bifascicular block 等 His-Purkinje 病變'},
  {id:'R', t:'R — Related precipitants absent', s:'沒有明確誘因（無久站、疼痛、情緒、排尿咳嗽等 trigger）'},
  {id:'O', t:'O — Older age > 65 years', s:'年齡大於 65 歲'},
  {id:'P', t:'P — PR prolongation', s:'PR interval 延長（first-degree AV block）'},
];

const DropCalc = () => {
  const [sel, setSel] = useState({});
  const score = DROP_ITEMS.filter(i=>sel[i.id]).length;
  const interp = score===0
    ? {c:'#27ae60', t:'原始研究中 score 0 者無人進展到需要 pacing。ILR 或門診追蹤即可。'}
    : score===1
    ? {c:'#7f8c8d', t:'低風險。尚未達 Syncope-Stopper 的收案門檻（需 ≥2）。'}
    : score<=2
    ? {c:'#f39c12', t:'達 Syncope-Stopper 收案門檻（DROP ≥2）。可與病人討論 upfront pacing vs ILR 監測。'}
    : {c:'#e74c3c', t:'高風險。原始 derivation 研究中 DROP ≥3 相較 0–1，未來需要 PPM 的 HR 6.3 (95% CI 4.1–8.5)。'};
  return (
    <div className="card">
      <h2>DROP Score 互動計算器</h2>
      <p className="small">點選符合的項目，每項 1 分，總分 0–4。</p>
      {DROP_ITEMS.map(i=>(
        <div key={i.id} className={`calc-item ${sel[i.id]?'sel':''}`} onClick={()=>setSel({...sel,[i.id]:!sel[i.id]})}>
          <div className="cbox">{sel[i.id]?'✓':''}</div>
          <div><div className="ct">{i.t}</div><div className="cs">{i.s}</div></div>
        </div>
      ))}
      <div className="score-box" style={{background:interp.c}}>
        <div className="n">{score}<span style={{fontSize:'17px'}}> / 4</span></div>
        <div className="d">{interp.t}</div>
      </div>
      <div className="warn" style={{marginTop:'12px'}}>
        <b>使用前提：</b>DROP score 是用在「initial evaluation 後仍 unexplained syncope」的病人。
        若已診斷 reflex syncope、orthostatic hypotension、或已有明確 structural/arrhythmic 原因，這個分數並不適用。
      </div>
    </div>
  );
};

/* ---------------- Quiz ---------------- */
const QUESTIONS = [
  {
    q:'DROP score 中的 "R" 代表什麼？',
    o:['Recurrent syncope（反覆暈厥）','Related historical precipitants absent（無明確誘因）','Right bundle branch block','Reduced ejection fraction'],
    a:1,
    e:'DROP = Distal conduction disease、Related precipitants absent、Older age >65、PR prolongation，各 1 分。注意：recurrent syncope 與 LVEF 在原始 derivation study 中並「不是」PPM 的預測因子。'
  },
  {
    q:'Syncope-Stopper 的 recurrent syncope 結果為 11.1% vs 21.8%，HR 0.47 (95% CI 0.23–0.97, P=0.037)。以下解讀何者最正確？',
    o:['結果為 neutral，兩組無差異','達統計顯著，但 95% CI 上緣 0.97 非常接近 1，效果估計不精準','完全排除了 pacing 無效的可能性','P=0.037 代表 pacing 有 96.3% 機率有效'],
    a:1,
    e:'CI 上緣 0.97 貼近 1、樣本數僅 200 人、事件數 33 件，屬於 fragile positive。方向是 positive 沒錯，但效果量的精確度有限，不宜直接外推成強建議。'
  },
  {
    q:'在 recurrent syncope 的機轉分析中，upfront PPM 組與 standard care 組的 bradycardic syncope 分別是幾例？',
    o:['0 vs 11','5 vs 11','11 vs 10','2 vs 3'],
    a:0,
    e:'Bradycardic syncope：0（PPM）vs 11（standard care，含 sinus pause 6、AV block 5）。但 non-bradycardic syncope 是 11 vs 10 — 幾乎一模一樣。這說明 pacemaker 只能解決它能解決的部分。'
  },
  {
    q:'Standard care 組最終有多少比例真的裝了 pacemaker？',
    o:['約 5%','約 19%','約 50%','約 80%'],
    a:1,
    e:'19/101 = 18.8%。換句話說，即使是 DROP ≥2 的「高風險」族群，仍有超過 80% 的人在 12 個月內從未需要 pacemaker。這是 Fedorowski 討論的核心：真正的挑戰是找出那 ~20%。'
  },
  {
    q:'關於 upfront PPM 組的裝置併發症，何者正確？',
    o:['完全沒有併發症','Major 3.0%、minor 9.1%，minor 中以 hematoma 最多','只有 minor 併發症，沒有 major','併發症率高於 30%'],
    a:1,
    e:'Major 3 例 (3.0%)：pocket revision、lead dislodgement、pericardial effusion 各 1；Minor 9 例 (9.1%)：hematoma 5、high lead threshold 2、upper-limb DVT 1、new moderate TR 1。NNT 9.3 要跟這個併發症負擔一起看。'
  },
  {
    q:'關於 primary composite endpoint 的設計，讀書會討論中提出的疑慮是？',
    o:['沒有 blinded adjudication','複合終點包含「bradycardia requiring pacemaker implantation」，而 upfront PPM 組依定義不可能發生此事件','追蹤時間太長','沒有納入 CV death'],
    a:1,
    e:'這是複合終點的結構性問題：已經裝了 PPM 的人不可能再「因為 bradycardia 而需要裝 PPM」，等於一個 component 對介入組是天然為零。這會讓複合終點朝有利於 pacing 的方向偏移。討論時值得把 individual components 拆開看。'
  },
];

const Quiz = () => {
  const [i,setI]=useState(0),[s,setS]=useState(null),[sc,setSc]=useState(0),[done,setDone]=useState(false);
  if(done) return (
    <div className="card">
      <h2>測驗結果</h2>
      <div className="score-box" style={{background: sc>=5?'#27ae60':sc>=3?'#f39c12':'#e74c3c'}}>
        <div className="n">{sc} / {QUESTIONS.length}</div>
        <div className="d">{sc>=5?'很好，關鍵細節都掌握了':sc>=3?'方向正確，建議再回顧結果與併發症章節':'建議重新閱讀 DROP 與結果解讀章節'}</div>
      </div>
      <button className="btn" onClick={()=>{setI(0);setS(null);setSc(0);setDone(false)}}>再測一次</button>
    </div>
  );
  const q=QUESTIONS[i];
  return (
    <div className="card">
      <h2>自我測驗</h2>
      <div className="pbar"><div style={{width:`${(i+1)/QUESTIONS.length*100}%`}}/></div>
      <p className="small">第 {i+1} 題 / 共 {QUESTIONS.length} 題</p>
      <p style={{fontWeight:500,fontSize:'15px'}}>{q.q}</p>
      {q.o.map((o,k)=>(
        <button key={k} disabled={s!==null}
          className={`opt ${s!==null && k===q.a?'correct':''} ${s===k&&k!==q.a?'wrong':''}`}
          onClick={()=>{setS(k); if(k===q.a) setSc(v=>v+1);}}>{o}</button>
      ))}
      {s!==null && (
        <div className="exp">
          <p style={{margin:'0 0 6px',fontWeight:700}}>{s===q.a?'✅ 正確':'❌ 再看一次'}</p>
          <p style={{margin:0}}>{q.e}</p>
          <button className="btn" onClick={()=>{ if(i<QUESTIONS.length-1){setI(i+1);setS(null);} else setDone(true); }}>
            {i<QUESTIONS.length-1?'下一題':'看結果'}
          </button>
        </div>
      )}
    </div>
  );
};

/* ---------------- KM 示意圖 ---------------- */
const KM = () => (
  <svg className="km" viewBox="0 0 340 210" xmlns="http://www.w3.org/2000/svg">
    <line x1="40" y1="175" x2="325" y2="175" stroke="#bdc3c7" strokeWidth="1"/>
    <line x1="40" y1="20" x2="40" y2="175" stroke="#bdc3c7" strokeWidth="1"/>
    {[0,10,20,30].map((v,i)=>(<g key={i}>
      <text x="34" y={179-v*4.4} fontSize="8" fill="#7f8c8d" textAnchor="end">{v}</text>
      <line x1="40" y1={175-v*4.4} x2="325" y2={175-v*4.4} stroke="#ecf0f1" strokeWidth="1"/>
    </g>))}
    {[0,3,6,9,12].map((m,i)=>(
      <text key={i} x={40+m*23.5} y="190" fontSize="8" fill="#7f8c8d" textAnchor="middle">{m}</text>
    ))}
    <text x="182" y="204" fontSize="8.5" fill="#7f8c8d" textAnchor="middle">Months since randomization</text>
    <text x="10" y="100" fontSize="8.5" fill="#7f8c8d" transform="rotate(-90 10 100)" textAnchor="middle">Cumulative incidence (%)</text>
    <polyline fill="none" stroke="#2980b9" strokeWidth="2.2"
      points="40,175 52,158 64,140 76,131 100,127 130,122 150,113 180,109 210,102 240,96 270,90 300,84 320,79"/>
    <polyline fill="none" stroke="#c0392b" strokeWidth="2.2"
      points="40,175 55,171 70,162 90,158 120,157 150,153 175,144 200,140 230,136 260,127 290,126 320,126"/>
    <text x="205" y="72" fontSize="9" fill="#2980b9" fontWeight="bold">Standard care 21.8%</text>
    <text x="205" y="140" fontSize="9" fill="#c0392b" fontWeight="bold">Upfront PPM 11.1%</text>
    <rect x="118" y="24" width="150" height="19" rx="5" fill="#fff3cd" stroke="#f0c36d"/>
    <text x="193" y="37" fontSize="9.5" fill="#2c3e50" textAnchor="middle" fontWeight="bold">HR 0.47 (0.23–0.97), P=0.037</text>
  </svg>
);

/* ---------------- 各頁 ---------------- */
const Home = () => (<>
  <div className="card takehome">
    <h2>Take Home Message</h2>
    {[
      '在 unexplained syncope 且 DROP score ≥2 的高風險族群，upfront pacemaker 相較 standard care 顯著降低 primary composite（相對風險降低 51%），為 positive trial。',
      'Recurrent syncope 11.1% vs 21.8%，HR 0.47 (95% CI 0.23–0.97)，P=0.037，NNT 9.3。但 95% CI 上緣 0.97 貼近 1，屬於 fragile positive，n=200、事件僅 33 件。',
      '好處來源非常明確：bradycardic syncope 0 vs 11 例。Non-bradycardic syncope（OH、vasovagal、psychogenic）11 vs 10 — 完全沒有差別。Pacemaker 只解決它能解決的那一半。',
      'Standard care 組 12 個月內只有 19/101 (18.8%) 最終真的需要 PPM。也就是說 DROP ≥2 這個門檻仍會讓約 8 成的人接受不必要的裝置。',
      '沒有 mortality benefit；all-cause hospitalisation 降低 43%。Upfront PPM 組 major complication 3.0%、minor 9.1%（standard care 分別 1.0%、0%）。',
      '臨床操作意涵：DROP ≥2 目前比較適合當作「這位病人值得認真討論 upfront pacing」的觸發點，而不是「直接裝」的指令。'
    ].map((t,i)=>(<div className="th-item" key={i}><div className="th-num">{i+1}</div><div className="th-txt">{t}</div></div>))}
  </div>

  <div className="card">
    <h2>一眼看完的數字</h2>
    <div className="stat-row">
      <div className="stat"><div className="v">51%</div><div className="l">Primary composite<br/>相對風險降低</div></div>
      <div className="stat"><div className="v">53%</div><div className="l">Recurrent syncope<br/>相對風險降低</div></div>
      <div className="stat"><div className="v">43%</div><div className="l">All-cause<br/>hospitalisation 降低</div></div>
    </div>
    <div className="stat-row">
      <div className="stat" style={{background:'#7f8c8d'}}><div className="v" style={{color:'#fff'}}>9.3</div><div className="l">NNT<br/>（recurrent syncope）</div></div>
      <div className="stat" style={{background:'#7f8c8d'}}><div className="v" style={{color:'#fff'}}>18.8%</div><div className="l">對照組最終<br/>裝 PPM 比例</div></div>
      <div className="stat" style={{background:'#7f8c8d'}}><div className="v" style={{color:'#fff'}}>12.1%</div><div className="l">PPM 組總併發症<br/>(major+minor)</div></div>
    </div>
    <div className="note">
      <b>臨床白話：</b>每 9–10 位 DROP ≥2 的病人接受 upfront pacing，可以在 12 個月內少 1 次暈厥；
      但同時大約每 8 位就有 1 位會遇到裝置相關併發症（多數為 minor，以 hematoma 為主）。這兩個數字要放在同一句話裡跟病人說。
    </div>
  </div>

  <div className="card">
    <h2>臨床情境：什麼樣的病人？</h2>
    <p>一位 78 歲男性，因為「在超市走一走突然倒下」到急診。沒有前驅症狀、沒有明顯誘因。ECG 顯示 RBBB + first-degree AV block（PR 220 ms）。Echo 顯示 LVEF 正常。抽血、carotid sinus massage、orthostatic BP 都沒有找到答案。</p>
    <div className="note">傳統做法：植入 ILR 等待「抓到」bradycardia 再裝 PPM。<br/>
    Syncope-Stopper 提出的問題：這位病人的 DROP score 已經是 3 分，還要等嗎？</div>
  </div>
</>);

const DropPage = () => (<>
  <div className="card">
    <h2>DROP Score 是什麼？</h2>
    <p>DROP score 是澳洲 Alfred Hospital 團隊（Xiao、William、Kistler 等人）在 2022 年提出的簡單風險分數，
    用來預測 <b>unexplained syncope 病人未來需要 permanent pacemaker (PPM) 的機率</b>。
    Syncope-Stopper 的主持人 Jeremy William 就是原始論文的共同作者，這個試驗等於是拿自己團隊的 score 做前瞻性驗證。</p>
