<style>
:root{

}
html.dark-theme{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg-cream);color:var(--text-dark);line-height:1.65;
  font-family:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",-apple-system,

.app{max-width:820px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom));}
header{background:linear-gradient(135deg,var(--primary),#2d5a87);color:#fff;

header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;}

.hbtn{position:absolute;top:18px;background:rgba(255,255,255,.18);border:none;color:#fff;

#themeBtn{right:14px;} #shareBtn{right:64px;}

  box-shadow:var(--shadow);border:1px solid var(--border);}
h2.sec{font-size:17px;margin:4px 0 12px;color:var(--primary-light);}
h3{font-size:15px;margin:14px 0 8px;}
p{margin:8px 0;font-size:14.5px;}
.small{font-size:13px;color:var(--text-muted);}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;}
.tag-card{background:#fdecea;color:#c0392b;} .tag-noncard{background:#e8f4fd;color:#1f6aa5;}
.tag-mixed{background:#fef5e7;color:#b9770e;}
.dark-theme .tag-card{background:#4a1f1a;color:#ff9b8f;}
.dark-theme .tag-noncard{background:#16324a;color:#8ec7f0;}

.takehome ol{margin:6px 0 0;padding-left:20px;} .takehome li{margin-bottom:9px;font-size:14.5px;}
.ddx{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--bg-card);}

  align-items:center;gap:10px;}
.ddx-head:active{background:rgba(125,125,125,.08);}
.ddx-title{font-weight:600;font-size:15px;}
.ddx-en{font-size:12px;color:var(--text-muted);display:block;font-weight:400;margin-top:2px;}
.chev{color:var(--text-muted);font-size:13px;flex-shrink:0;}
.ddx-body{padding:0 14px 14px;border-top:1px dashed var(--border);}
.row{margin-top:11px;}

.timing span{font-size:11.5px;background:var(--border);padding:4px 10px;border-radius:6px;}
.flow{display:flex;gap:12px;margin-bottom:12px;}
.flow-n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--primary-light);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.do,.dont{padding:11px 13px;border-radius:9px;font-size:14px;margin-bottom:8px;}
.do{background:#eafaf1;border-left:4px solid var(--success);}
.dont{background:#fdecea;border-left:4px solid var(--accent);}
.dark-theme .do{background:#153a28;} .dark-theme .dont{background:#3d1d1a;}
.tl{border-left:2px solid var(--primary-light);margin-left:8px;padding-left:16px;}
.tl-i{position:relative;padding-bottom:14px;font-size:14px;}

.qq{font-size:15.5px;font-weight:600;margin:10px 0 14px;}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:9px;min-height:48px;
  border:2px solid var(--border);background:var(--bg-card);color:var(--text-dark);border-radius:10px;
  font-size:14.5px;font-family:inherit;cursor:pointer;}
.opt.correct{border-color:var(--success);background:#eafaf1;}
.opt.wrong{border-color:var(--accent);background:#fdecea;}
.opt.reveal{border-color:var(--success);}
.dark-theme .opt.correct{background:#153a28;} .dark-theme .opt.wrong{background:#3d1d1a;}
.explain{background:var(--bg-cream);border-radius:10px;padding:13px;margin-top:6px;font-size:14px;
  border:1px solid var(--border);}
.btn{background:var(--primary-light);color:#fff;border:none;padding:13px 20px;border-radius:10px;
  font-size:15px;font-weight:600;font-family:inherit;min-height:48px;cursor:pointer;width:100%;margin-top:12px;}
.pbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:14px;}
.pbar div{height:100%;background:var(--success);transition:width .3s;}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60;box-shadow:0 -2px 14px rgba(0,0,0,.07);
  max-width:820px;margin:0 auto;}
nav button{flex:1;background:none;border:none;padding:9px 2px 10px;font-size:10.5px;font-family:inherit;
  color:var(--text-muted);cursor:pointer;min-height:56px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;}
nav button.active{color:var(--primary-light);font-weight:700;}
nav .ico{font-size:19px;line-height:1;}
footer{padding:20px 18px 26px;font-size:11.5px;color:var(--text-muted);text-align:center;line-height:1.9;}
footer .sig{color:var(--text-dark);font-weight:600;font-size:13px;margin-bottom:8px;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
th,td{border:1px solid var(--border);padding:8px 9px;text-align:left;vertical-align:top;}
th{background:var(--bg-cream);font-weight:600;font-size:12.5px;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;
  align-items:flex-end;justify-content:center;}
.mask[hidden]{display:none;}
.sheet{background:var(--bg-card);width:100%;max-width:820px;border-radius:18px 18px 0 0;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 4px;font-size:17px;}
.sheet .btn{background:var(--bg-cream);color:var(--text-dark);border:1px solid var(--border);
  text-align:left;padding:14px 16px;}
.sheet .btn b{display:block;font-size:15px;} .sheet .btn span{font-size:12.5px;color:var(--text-muted);font-weight:400;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--primary);
  color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;z-index:200;}
.toast[hidden]{display:none;}
@media print{header,nav,.mask,#shareBtn,#themeBtn{display:none!important}
  .app{padding-bottom:0}.card{break-inside:avoid;box-shadow:none}}
</style>

<script>
(function(){
"use strict";

var DDX=[
{id:"pe",name:"子癇前症／HELLP 相關肺水腫",en:"Pre-eclampsia / HELLP-associated pulmonary oedema",
 type:"mixed",timing:["> 20 週","產後 48–72 小時"],
 clues:["血壓 ≥160/110 mmHg 合併蛋白尿或器官損傷","頭痛、視力模糊、上腹（RUQ）痛、反射亢進",
  "Platelet 下降、AST/ALT 上升、LDH 上升、溶血 → HELLP","常合併大量點滴輸液或 oxytocin 使用"],
 workup:["尿蛋白／protein-creatinine ratio","CBC、LFT、LDH、peripheral smear","sFlt-1/PlGF ratio（若可得）",
  "Echo：多為 preserved EF 合併 diastolic dysfunction"],
 mech:"後負荷急升 + 低 oncotic pressure（albumin 下降）+ 內皮受損微血管滲漏，三者疊加。EF 正常不代表不是心因性。",
 pit:"最常見的孕期肺水腫原因。EF 正常常讓人誤判為「非心因性」而放掉降壓與限水。"},

{id:"ppcm",name:"週產期心肌病變",en:"Peripartum cardiomyopathy (PPCM)",
 type:"card",timing:["妊娠末期","產後 5 個月內（最多見於產後第一個月）"],
 clues:["排除性診斷：新發 HF、EF 低於 45%、無其他可解釋病因","危險因子：多胎、高齡、子癇前症、非裔族群、家族史",
  "NT-proBNP 顯著上升（正常值幾乎可排除）","可合併 LV thrombus、心室性心律不整"],
 workup:["Echo（EF、LV 大小、thrombus）","NT-proBNP、troponin","排除 SCAD、瓣膜病、既有心肌病變",
  "基因諮詢／檢測（2025 ESC 建議考慮）"],
 mech:"prolactin 16-kDa 裂解片段等因子造成血管毒性與心肌損傷。",
 pit:"產後喘常被歸因於「產後虛弱」而延遲診斷。EF 恢復後 HF 藥物建議續用 12 個月以上。"},

{id:"toco",name:"安胎藥物誘發肺水腫",en:"Tocolytic-induced pulmonary oedema",
 type:"noncard",timing:["用藥後 24–72 小時"],
 clues:["使用 β-agonist（ritodrine, terbutaline）安胎中","常合併 corticosteroid 促胎肺成熟與大量輸液",
  "心搏過速、低血鉀、高血糖","多胎妊娠風險更高"],
 workup:["停藥後多在 12–24 小時內快速改善","Echo 通常正常 → 支持非心因性","電解質、血糖"],
 mech:"β-agonist 造成鈉水滯留、心搏過速與微血管通透性上升；再加上輸液，屬容量與滲漏的混合機轉。",
 pit:"處置的第一步是「停藥」，不是加藥。台灣仍常用 ritodrine，這一項務必列入病史詢問。"},

{id:"valve",name:"既有瓣膜性心臟病失代償（尤其 mitral stenosis）",en:"Decompensated valvular heart disease",
 type:"card",timing:["妊娠 20–28 週（CO 高峰）","生產中與產後即刻"],
 clues:["風濕性心臟病史；新住民族群要特別想到","心尖舒張期雜音、opening snap、新發 AF",
  "心跳加快即惡化（MS 依賴舒張期充盈時間）","過去未追蹤或未曾做過 echo"],
 workup:["Echo：MVA、mean gradient、PASP","ECG：AF、LA enlargement",
  "必要時 PTMC 可於孕期執行（腹部屏蔽、盡量縮短透視時間）"],
 mech:"孕期血漿容積增加 40–50%、CO 上升、心搏加快，跨瓣壓差急升使肺靜脈壓上升。",
 pit:"心跳控制（β-blocker）比利尿更關鍵。此類病人在產後 autotransfusion 那一刻最危險。"},

{id:"pheo",name:"嗜鉻細胞瘤危象",en:"Pheochromocytoma crisis",
 type:"card",timing:["任何週數","生產、麻醉誘導、腹壓上升時可被誘發"],
 clues:["陣發性（非持續性）高血壓合併頭痛、盜汗、心悸三聯徵","血壓極度 labile、姿勢性低血壓","20 週前即出現高血壓",
  "蛋白尿常缺乏，不像子癇前症","可表現為 takotsubo-like 心肌病變與心因性休克"],
 workup:["Plasma free metanephrines 或 24 小時尿液 metanephrines","MRI（孕期避免 CT 與 MIBG）",
  "Echo：apical ballooning 或瀰漫性收縮功能低下"],
 mech:"兒茶酚胺風暴造成心肌頓抑與後負荷急升，屬 catecholamine-induced cardiomyopathy，切除腫瘤後心功能多可回復。",
 pit:"先給 β-blocker 而未先做 α-blockade（phenoxybenzamine / doxazosin）會因 unopposed α 造成血壓爆衝。"},

{id:"afe",name:"羊水栓塞",en:"Amniotic fluid embolism (AFE)",
 type:"mixed",timing:["生產中或產後 30 分鐘內"],
 clues:["突發低血壓、缺氧、意識改變三聯徵","緊接著出現 DIC 與大量出血","常在破水、子宮收縮強烈或器械生產後"],
 workup:["臨床診斷，無特異檢查","DIC panel：fibrinogen、D-dimer、PT/aPTT","Echo：急性 RV 衰竭與 D-shape"],
 mech:"初期為肺血管收縮與急性右心衰竭，之後轉為左心衰竭與非心因性肺水腫加 DIC。",
 pit:"死亡率極高。需立即啟動大量輸血流程與 ECMO 評估，不是單純利尿的問題。"},

{id:"vte",name:"深部靜脈血栓與血栓性肺栓塞",en:"DVT and thrombotic pulmonary embolism (VTE)",
 type:"mixed",timing:["任何週數，第一孕期起風險即上升","產後 6 週內為最高峰（尤以產後 1–2 週）"],
 clues:["<b>喘與低血氧，但胸片相對乾淨</b>——沒有 B-lines、沒有肺水腫，這是與本清單其他項目最重要的分界",
  "肋膜性胸痛、咳血、不明原因的持續心搏過速或暈厥",
  "單側下肢腫脹疼痛；孕期 DVT <b>約 85–90% 發生在左腿</b>（左髂總靜脈受右髂總動脈與妊娠子宮壓迫）",
  "以 <b>iliofemoral 近端</b>為主，可只表現為臀部、腹股溝或下背痛，小腿反而不腫",
  "大量 PE 時為急性右心衰竭與<b>阻塞型休克</b>：頸靜脈怒張、RV 擴大、D-shape、低血壓",
  "風險加成：剖腹產、子癇前症、臥床安胎、肥胖、多胞胎、產後出血與輸血、既往 VTE 或 thrombophilia"],
 workup:["<b>疑似 DVT 先做下肢加壓超音波（CUS）</b>；一旦確診即開始抗凝，不必再為了找 PE 加照胸部影像",
  "疑似 PE：先照胸部 X 光；搭配 pregnancy-adapted YEARS 演算法可安全省下部分 CTPA",
  "CTPA 與 V/Q scan 孕期都可執行；CTPA 胎兒劑量較低但母體乳房劑量較高，V/Q 大致相反",
  "Echo：RV 擴大、D-shape、TAPSE 下降、McConnell sign；LV 收縮功能通常正常",
  "Lung ultrasound 以 <b>A-lines</b> 為主而非 B-lines，是與心因性肺水腫最快的分野"],
 mech:"孕期 Virchow 三要素同時成立：凝血因子 VII／VIII／X 與 fibrinogen 上升、protein S 下降、PAI-1／PAI-2 上升造成高凝狀態；黃體素使靜脈擴張、妊娠子宮壓迫髂靜脈造成鬱滯；生產與剖腹造成內皮損傷。大量 PE 的血流動力學崩潰來自右心室後負荷急升，本質是阻塞型休克，不是肺水腫。",
 pit:"<b>孕期 D-dimer 生理性上升，非孕期參考值不適用，不能用來排除 VTE。</b>抗凝以 <b>LMWH</b> 為主（不通過胎盤）；warfarin 於妊娠 6–12 週有致畸風險，<b>DOAC 於孕期與哺乳期禁用</b>。危及生命的大量 PE，thrombolysis 並非絕對禁忌，並應同時評估導管取栓、外科取栓與 ECMO。另需提前規劃麻醉時間：治療劑量 LMWH 通常需停藥 24 小時以上才能執行 neuraxial 麻醉。"},

{id:"iatro",name:"醫源性容積過載",en:"Iatrogenic fluid overload",
 type:"card",timing:["生產中與產後 24 小時內"],
 clues:["Oxytocin 長時間高劑量輸注（具 ADH 樣作用，造成水滯留與低血鈉）","區域麻醉前預先大量輸液",
  "產後出血復甦後輸液總量偏高","入出量表明顯正平衡"],
 workup:["嚴格記錄輸出入量與體重","Na、osmolality","Lung ultrasound：雙側 B-lines"],
 mech:"孕期血漿膠體滲透壓本就下降，容忍過載的餘裕比非孕者小很多。",
 pit:"這是最容易預防、也最容易被忽略的一項。產科大量輸液後的喘，先想這個。"},

{id:"acs",name:"孕產期心肌梗塞／SCAD",en:"Pregnancy-associated MI / spontaneous coronary artery dissection",
 type:"card",timing:["妊娠末期與產後 6 週內為高峰"],
 clues:["胸痛合併肺水腫","SCAD 是孕產期 MI 最常見機轉，好發於無傳統危險因子的年輕女性",
  "ECG ST 變化、troponin 上升","可合併纖維肌性發育不良 (FMD)"],
 workup:["12-lead ECG、troponin 系列","Echo：局部壁動異常","必要時冠狀動脈攝影（腹部屏蔽，優先橈動脈路徑）"],
 mech:"荷爾蒙造成血管中層變化，加上生產時剪應力，導致自發性剝離。",
 pit:"SCAD 多數以保守治療為主，貿然 PCI 可能使剝離延伸；但合併心因性休克時例外。"},

 '<li>四個必問病史：<b>安胎藥物</b>、<b>輸液總量與 oxytocin</b>、<b>過去心臟病史與風濕熱</b>、<b>高血壓是持續還是陣發</b>。</li>'+
 '<li><b>陣發性高血壓＋頭痛盜汗心悸＋無蛋白尿</b>，要想 pheochromocytoma，先 α-blockade 再 β-blocker。</li>'+
 '<li>Lung ultrasound 加 POCUS 是最快的分流工具；<b>NT-proBNP 正常幾乎可排除心衰竭</b>。</li>'+
 '<li>孕期禁用 <b>ACE-I / ARB / ARNI / MRA / ivabradine / SGLT2i</b>；心因性休克可用 levosimendan、dobutamine、milrinone。</li>'+
 '<li><b>喘＋低血氧但胸片乾淨</b>，要想血栓性肺栓塞；孕期 VTE 風險以<b>產後 6 週內</b>最高，DVT 約 85–90% 在左腿，<b>D-dimer 不能用來排除</b>，抗凝用 LMWH（DOAC 禁用）。</li>'+
 '<li>血流動力學無法穩定時，<b>生產本身就是治療</b>；並提早評估轉送具 MCS 能力的中心。</li></ol></div>'+

 '<div class="do"><b>NIV／HFNC</b>：可使用，但需嚴密監測意識與嘔吐風險（孕婦吸入性肺炎風險高）。</div>'+

function viewCase(){
 return '<div class="card"><h2 class="sec">📋 案例：孕期急性肺水腫（ESC Congress, Erasmus MC）</h2>'+
 '<p class="small">此案例最終診斷為 <b>pheochromocytoma of the left adrenal gland</b>，是「陣發性高血壓加心因性休克」路徑的教科書級示範。</p>'+
 '<div class="tl" style="margin-top:14px">'+
 '<div class="tl-i"><div class="tl-t">T = 0</div>孕期急性肺水腫，進展為心因性休克</div>'+
 '<div class="tl-i"><div class="tl-t">T = 120 min</div>於<b>導管室內</b>施行緊急剖腹產 (emergent caesarean section at the cathlab)</div>'+
 '<div class="tl-i"><div class="tl-t">T = 150 min</div>新生兒轉入 neonatal ICU</div>'+
 '<div class="tl-i"><div class="tl-t">T = 180 min</div>導管室內置入 VA-ECMO，轉入 ICU</div>'+
 '<div class="tl-i"><div class="tl-t">T = 7 days</div>VA-ECMO explantation</div>'+
 '<div class="tl-i"><div class="tl-t">T = 3 months</div>進一步檢查發現左側腎上腺 pheochromocytoma，接受單側 adrenalectomy</div>'+
 '</div></div>'+
 '<div class="card"><h2 class="sec">💡 這個案例的三個教學點</h2>'+
 '<h3>1. 為什麼在導管室生產？</h3><p style="font-size:14px">不穩定病人搬不動；生產可立即解除 aortocaval compression 並降低心輸出需求；而且先完成生產再肝素化上 ECMO，可避免 gravid uterus 與子宮切口在抗凝下大出血。導管室同時具備透視與立即 cannulation 的能力。</p>'+
 '<h3>2. 時序反映的是團隊同步啟動</h3><p style="font-size:14px">120 → 150 → 180 分鐘的間隔，代表產科、新生兒科與 ECMO team 是<b>同時 activate</b>，不是依序呼叫。這是流程設計的問題，不是個人反應速度的問題。</p>'+
 '<h3>3. 診斷可以是後來才浮現的</h3><p style="font-size:14px">急性期的目標是穩定血流動力學，病因診斷在 ECMO 撤除後才確立。但如果急性期完全沒把 pheochromocytoma 放進鑑別清單，後續的 metanephrines 與影像也不會被安排。catecholamine cardiomyopathy 在腫瘤切除後心功能通常可回復，這正是值得積極支持的理由。</p></div>';
}

function viewQuiz(){
 if(S.qdone){
  var msg=S.qscore===QUIZ.length?"全對，可以直接拿去帶 case discussion 了。":
    (S.qscore>=QUIZ.length*0.7?"掌握良好，再回頭看一次錯的那幾題的陷阱說明。":"建議重看「鑑別診斷」與「診斷流程」兩節。");
  return '<div class="card" style="text-align:center"><h2 class="sec">測驗結果</h2>'+
   '<p style="font-size:38px;font-weight:700;color:var(--primary-light);margin:8px 0">'+S.qscore+' / '+QUIZ.length+'</p>'+
   '<p class="small">'+msg+'</p><button class="btn" id="restart">重新測驗</button></div>';
 }
 var q=QUIZ[S.qi];
 var h='<div class="card"><div class="pbar"><div style="width:'+((S.qi+1)/QUIZ.length*100)+'%"></div></div>'+
  '<div class="small">第 '+(S.qi+1)+' 題 / 共 '+QUIZ.length+' 題　·　目前得分 '+S.qscore+'</div>'+
  '<div class="qq">'+q.q+'</div>';
 q.o.forEach(function(o,k){
  var cls="opt";
  if(S.qshow){ if(k===S.qsel)cls+=(k===q.c?" correct":" wrong"); else if(k===q.c)cls+=" reveal"; }
  h+='<button class="'+cls+'" data-opt="'+k+'">'+String.fromCharCode(65+k)+'. '+o+'</button>';
 });
 if(S.qshow){
  h+='<div class="explain"><p style="margin:0 0 6px;font-weight:700">'+
   (S.qsel===q.c?"✅ 正確":"❌ 錯誤，正確答案為 "+String.fromCharCode(65+q.c))+'</p>'+
   '<p style="margin:0">'+q.e+'</p><button class="btn" id="nextQ">'+
   (S.qi<QUIZ.length-1?"下一題":"查看結果")+'</button></div>';
 }
 return h+'</div>';
}

function render(){
 var v={home:viewHome,ddx:viewDdx,workup:viewWorkup,case:viewCase,quiz:viewQuiz}[S.tab];
 document.getElementById("main").innerHTML=v()+FOOT;
 document.getElementById("nav").innerHTML=TABS.map(function(t){
  return '<button data-tab="'+t.id+'" class="'+(S.tab===t.id?"active":"")+'">'+
   '<span class="ico">'+t.ico+'</span>'+t.t+'</button>';
 }).join("");
 document.documentElement.classList.toggle("dark-theme",S.dark);
 document.getElementById("themeBtn").textContent=S.dark?"☀":"🌙";
}

function toast(msg){
 var t=document.getElementById("toast");
 t.textContent=msg; t.hidden=false;
 clearTimeout(t._h); t._h=setTimeout(function(){t.hidden=true;},2200);
}

document.addEventListener("click",function(e){
 var el;
 if((el=e.target.closest("[data-tab]"))){S.tab=el.getAttribute("data-tab");save();render();window.scrollTo(0,0);return;}
 if((el=e.target.closest("[data-ddx]"))){var id=el.getAttribute("data-ddx");S.open=(S.open===id?null:id);render();return;}
 if((el=e.target.closest("[data-opt]"))){
  if(S.qshow)return;
  var k=parseInt(el.getAttribute("data-opt"),10);
  S.qsel=k;S.qshow=true;if(k===QUIZ[S.qi].c)S.qscore++;render();return;}
 if(e.target.closest("#nextQ")){
  if(S.qi<QUIZ.length-1){S.qi++;S.qsel=null;S.qshow=false;}else{S.qdone=true;}
  render();window.scrollTo(0,0);return;}
 if(e.target.closest("#restart")){S.qi=0;S.qsel=null;S.qshow=false;S.qscore=0;S.qdone=false;render();return;}
});

document.getElementById("themeBtn").addEventListener("click",function(){S.dark=!S.dark;save();render();});

/* ---- 分享 ---- */
var mask=document.getElementById("mask");
document.getElementById("shareBtn").addEventListener("click",function(){mask.hidden=false;});
document.getElementById("closeSheet").addEventListener("click",function(){mask.hidden=true;});
mask.addEventListener("click",function(e){if(e.target===mask)mask.hidden=true;});

document.getElementById("sysShare").addEventListener("click",function(){
 var data={title:"懷孕期肺水腫的鑑別診斷",text:"懷孕期肺水腫鑑別診斷教學（讀書會共筆）",url:location.href};
 if(navigator.share){
  navigator.share(data).then(function(){mask.hidden=true;}).catch(function(){});
 }else{
  copy(location.href,"此裝置不支援系統分享，已複製連結");
 }
});

function copy(txt,msg){
 function done(){mask.hidden=true;toast(msg||"已複製");}
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(txt).then(done).catch(fallback);
 }else{fallback();}
 function fallback(){
  var ta=document.createElement("textarea");
  ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(err){toast("複製失敗，請手動複製網址");}
  document.body.removeChild(ta);
 }
}
document.getElementById("copyLink").addEventListener("click",function(){copy(location.href,"連結已複製");});

document.getElementById("dlFile").addEventListener("click",function(){
 try{
  var clone=document.documentElement.cloneNode(true);
  var m=clone.querySelector("#main"); if(m)m.innerHTML="";
  var n=clone.querySelector("#nav"); if(n)n.innerHTML="";
  var mk=clone.querySelector("#mask"); if(mk)mk.setAttribute("hidden","");
  clone.classList.remove("dark-theme");
  var html="<!DOCTYPE html>\n"+clone.outerHTML;
  var blob=new Blob([html],{type:"text/html;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="懷孕期肺水腫鑑別診斷.html";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  mask.hidden=true;toast("已下載，可直接傳給同仁");
 }catch(err){toast("下載失敗，請改用瀏覽器的「儲存頁面」");}
});

document.getElementById("printBtn").addEventListener("click",function(){
 mask.hidden=true;setTimeout(function(){window.print();},250);
});

load();render();
})();
</script>
