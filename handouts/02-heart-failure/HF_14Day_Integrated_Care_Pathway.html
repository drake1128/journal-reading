<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心衰竭 14 天整合照護 Pathway 教學｜Pathway × 心臟復健</title>
<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#e74c3c;
  --success:#27ae60; --warning:#f39c12; --info:#2980b9;
  --bg-cream:#faf8f5; --bg-card:#ffffff; --text-dark:#2c3e50; --text-muted:#7f8c8d;
  --border:#ecf0f1; --shadow:0 4px 20px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg-cream);color:var(--text-dark);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",
    -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.75;font-size:16px;}
#app{max-width:860px;margin:0 auto;padding-bottom:calc(90px + env(safe-area-inset-bottom));}

.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  color:#fff;padding:26px 20px 22px;}
.hero h1{margin:0 0 6px;font-size:1.32rem;font-weight:700;line-height:1.45;}
.hero .sub{font-size:.86rem;opacity:.9;margin:0;}
.hero .tagrow{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.tag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:4px 12px;font-size:.75rem;}

nav.tabs{position:sticky;top:0;z-index:50;background:var(--bg-card);
  border-bottom:1px solid var(--border);display:flex;overflow-x:auto;
  scrollbar-width:none;box-shadow:0 2px 10px rgba(0,0,0,.04);}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{flex:0 0 auto;min-height:50px;padding:12px 15px;border:none;background:none;
  font-family:inherit;font-size:.87rem;font-weight:500;color:var(--text-muted);
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
nav.tabs button.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:700;}

.wrap{padding:18px 16px 30px;}
.card{background:var(--bg-card);border-radius:14px;padding:18px;margin-bottom:16px;
  box-shadow:var(--shadow);border:1px solid var(--border);}
.card h2{margin:0 0 12px;font-size:1.08rem;color:var(--primary);font-weight:700;}
.card h3{margin:18px 0 8px;font-size:.98rem;color:var(--primary-light);font-weight:600;}
.card p{margin:0 0 10px;font-size:.93rem;}
.muted{color:var(--text-muted);font-size:.82rem;}

.takehome{border-left:5px solid var(--accent);background:#fff5f3;}
.takehome ol{margin:0;padding-left:20px;}
.takehome li{margin-bottom:9px;font-size:.94rem;}

.callout{border-radius:10px;padding:13px 15px;margin:12px 0;font-size:.89rem;}
.callout.warn{background:#fef6e7;border-left:4px solid var(--warning);}
.callout.danger{background:#fdedec;border-left:4px solid var(--accent);}
.callout.good{background:#eafaf1;border-left:4px solid var(--success);}
.callout.info{background:#eaf2fa;border-left:4px solid var(--info);}
.callout b{color:var(--primary);}

table{width:100%;border-collapse:collapse;font-size:.85rem;margin:10px 0;}
th{background:var(--primary);color:#fff;padding:9px 7px;text-align:left;font-weight:600;font-size:.8rem;}
td{padding:9px 7px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

.grouprow{display:flex;gap:10px;align-items:center;padding:12px;border-radius:11px;
  border:2px solid var(--border);margin-bottom:9px;cursor:pointer;background:#fff;
  transition:.16s;min-height:56px;}
.grouprow.sel{border-color:var(--primary-light);background:#f4f8fc;}
.gbadge{flex:0 0 74px;text-align:center;font-weight:700;font-size:.82rem;color:#fff;
  border-radius:8px;padding:7px 4px;}
.gmeta{flex:1;font-size:.83rem;line-height:1.5;}
.ghr{flex:0 0 auto;font-weight:700;font-size:.9rem;text-align:right;}

.cibar-row{display:flex;align-items:center;gap:8px;margin-bottom:11px;font-size:.78rem;}
.cibar-label{flex:0 0 68px;font-weight:600;}
.cibar-track{flex:1;height:26px;position:relative;background:#f3f5f7;border-radius:5px;}
.cibar-one{position:absolute;top:0;bottom:0;width:2px;background:#b0b8c0;}
.cibar-seg{position:absolute;top:8px;height:10px;border-radius:5px;opacity:.75;}
.cibar-dot{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;
  transform:translateX(-8px);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.cibar-val{flex:0 0 100px;text-align:right;font-weight:600;}

.day{border-radius:12px;margin-bottom:11px;overflow:hidden;border:1px solid var(--border);
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.dayhead{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;min-height:60px;}
.daychip{flex:0 0 84px;color:#fff;border-radius:8px;padding:7px 5px;text-align:center;
  font-weight:700;font-size:.8rem;line-height:1.3;}
.daytitle{flex:1;}
.daytitle b{display:block;font-size:.98rem;}
.daytitle span{font-size:.78rem;color:var(--text-muted);}
.daypct{flex:0 0 auto;font-size:.75rem;color:var(--text-muted);font-weight:600;}
.daybody{padding:0 14px 14px;border-top:1px dashed var(--border);}

.rolehead{margin:14px 0 6px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:7px;}
.roledot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:9px;
  background:#fafbfc;border:1px solid var(--border);margin-bottom:7px;cursor:pointer;
  min-height:48px;transition:.15s;}
.chk.done{background:#eafaf1;border-color:#a9e0c1;}
.chk.done .chktxt{color:var(--text-muted);}
.box{flex:0 0 21px;height:21px;border-radius:6px;border:2px solid #cfd8dd;background:#fff;
  display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:13px;color:#fff;}
.chk.done .box{background:var(--success);border-color:var(--success);}
.chktxt{font-size:.87rem;line-height:1.6;}

.progressbar{height:9px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0 4px;}
.progressbar > div{height:100%;background:linear-gradient(90deg,var(--success),#5ec98a);transition:width .3s;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
  padding:12px 18px;border-radius:10px;border:none;background:var(--primary);color:#fff;
  font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary-light);}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.82rem;}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;}

.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:9px;border-radius:10px;
  border:2px solid var(--border);background:#fff;font-family:inherit;font-size:.9rem;
  cursor:pointer;min-height:48px;line-height:1.6;color:inherit;}
.opt.correct{border-color:var(--success);background:#eafaf1;}
.opt.wrong{border-color:var(--accent);background:#fdedec;}
.opt:disabled{cursor:default;}

.ref{padding:12px 0;border-bottom:1px solid var(--border);font-size:.85rem;}
.ref:last-child{border-bottom:none;}
.ref a{color:var(--info);text-decoration:none;word-break:break-all;font-size:.8rem;}
.reftag{display:inline-block;background:var(--primary);color:#fff;border-radius:5px;
  padding:1px 8px;font-size:.7rem;margin-right:7px;font-weight:600;}

footer.sig{background:var(--primary);color:#fff;padding:22px 18px 26px;font-size:.8rem;line-height:1.85;}
footer.sig b{font-size:.92rem;}
footer.sig .disc{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);
  opacity:.85;font-size:.75rem;}

.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:60;display:flex;gap:9px;}
.fab button{border:none;border-radius:999px;padding:12px 20px;min-height:48px;
  background:var(--primary);color:#fff;font-family:inherit;font-size:.85rem;font-weight:600;
  box-shadow:0 6px 22px rgba(30,58,95,.35);cursor:pointer;}
.fab button.alt{background:#fff;color:var(--primary);border:1.5px solid var(--border);}

@media print{
  nav.tabs,.fab{display:none!important;}
  .card{box-shadow:none;page-break-inside:avoid;}
  body{background:#fff;}
}
</style>
</head>

function ciBar(){
  var lo=Math.log(0.15), hi=Math.log(1.6);
  function pos(v){ return ((Math.log(v)-lo)/(hi-lo))*100; }
  var h="";
  GROUPS.filter(function(g){return g.lo!==null;}).forEach(function(g){
    h+='<div class="cibar-row"><div class="cibar-label" style="color:'+g.color+'">'+g.label+'</div>'+
       '<div class="cibar-track"><div class="cibar-one" style="left:'+pos(1)+'%"></div>'+
       '<div class="cibar-seg" style="left:'+pos(g.lo)+'%;width:'+(pos(g.hi)-pos(g.lo))+'%;background:'+g.color+'"></div>'+
       '<div class="cibar-dot" style="left:'+pos(parseFloat(g.hr))+'%;background:'+g.color+'"></div></div>'+
       '<div class="cibar-val">'+g.hr+' ('+g.lo+'–'+g.hi+')</div></div>';
  });
  h+='<div style="display:flex;font-size:.7rem;color:var(--text-muted);margin-top:-4px">'+
     '<div style="flex:0 0 68px"></div><div style="flex:1;position:relative;height:16px">'+
     '<span style="position:absolute;left:'+pos(0.2)+'%">0.2</span>'+
     '<span style="position:absolute;left:'+pos(0.5)+'%">0.5</span>'+
     '<span style="position:absolute;left:'+pos(1)+'%;font-weight:700;color:#c0392b">1.0</span>'+
     '<span style="position:absolute;left:'+pos(1.5)+'%">1.5</span>'+
     '</div><div style="flex:0 0 100px"></div></div>';
  return h;
}

  return '<div class="wrap">'+
  '<div class="card"><h2>📊 IPTW 校正後結果（點選任一組）</h2>'+
  '<p class="muted">以 P−/R− 為對照組的四組 IPTW Cox 模型；Global Wald χ²(3)=9.72, p=0.021。</p>'+rows+
  '<div class="callout info" style="margin-top:14px"><b>'+g.label+'｜'+g.name+'</b><br>'+g.desc+'<br><br>'+g.note+'</div></div>'+

  '<div class="card"><h2>⚠️ 解讀陷阱：為什麼不能說「復健可以不做」</h2>'+
  '<p>把三組的 95% 信賴區間畫在同一條對數軸上，一眼就看得出來：</p>'+ciBar()+
  '<div class="callout danger"><b>陷阱一：信賴區間大幅重疊。</b>P+/R− 的 CI (0.21–0.94) 幾乎完全包住 P+/R+ 的 CI (0.37–1.04)。點估計 0.44 vs 0.62 的差距，在統計上完全無法區辨。看點估計排名而忽略區間，是最常見的誤讀。</div>'+
  '<div class="callout danger"><b>陷阱二：事件數太少。</b>P+/R− 只有 <b>16 個死亡事件</b>。Cox 模型的穩定度取決於事件數而非人數；16 個事件配上多變項 PS 校正，估計值極不穩定，CI 才會寬到跨 4.5 倍。</div>'+
  '<div class="callout danger"><b>陷阱三：confounding by indication。</b>誰被開了復健醫囑，本身就不是隨機的。在日本，住院心臟復健開立率很高（本研究 706+255=961/1494 ≈ 64%）。<b>沒有</b>被開復健的病人可能是兩種極端：一種是本來就能自己走、住幾天就出院的相對輕症；另一種是重症到根本無法動。這兩種相反方向的選擇偏差，都會扭曲 P+/R− 這一組的結果。</div>'+
  '<div class="callout warn"><b>陷阱四：用錯了指標。</b>ExCR 在 RCT 中的實證強項是<b>再住院與生活品質</b>，不是死亡率。Cochrane 2023：全因死亡 RR 0.93 (95% CI 0.71–1.21，未達顯著)，但全因住院 RR 0.69 (0.56–0.86, NNT 13)、MLWHF 改善 −7.39 分。用一個復健本來就沒被證實能改善的指標去否定復健，邏輯上不成立。</div>'+
  '<div class="callout warn"><b>陷阱五：其他方法學限制。</b>回溯性、單中心；分析單位是<b>住院次</b>而非病人（同一人可重複計入）；IPTW 用完整資料世代 N=990，等於從 1,494 中排除約 34%；殘餘干擾、選擇偏差、日曆時間效應（2020–2025 橫跨 COVID 期間，GDMT 也在這五年大幅演進）皆可能存在。海報自己也寫明結論屬 associative and hypothesis-generating。</div></div>'+

  '<div class="card"><h2>✅ 那這份研究到底教了我們什麼</h2>'+
  '<div class="callout good"><b>可以說的：</b>在真實世界中，<b>接受任何一種結構化介入的病人，1 年存活都比兩者皆無的病人好</b>；整體四組之間存在差異 (Wald p=0.021)；這支持把心衰竭住院照護流程化的方向。</div>'+
  '<div class="callout danger"><b>不能說的：</b>不能說 pathway 優於復健、不能說復健可省略、不能說任何一組「造成」死亡率下降。這是觀察性資料。</div>'+
  '<div class="callout info"><b>對我們的實務意義：</b>不要把 pathway 和復健當成兩個競爭選項去二選一。Pathway 是<b>載體</b>，復健、GDMT 上調、營養、衛教、出院準備都是裝在裡面的<b>成分</b>。真正要做的事，是把這些成分綁定時程、綁定負責人，讓它每一床都跑得起來。</div></div>'+
  '</div>';
}

    c+='<div class="chk" style="cursor:default;background:#fef6e7;border-color:#f5d99a"><div class="box" style="background:var(--warning);border-color:var(--warning)">!</div><div class="chktxt">'+t+'</div></div>';
  });
  return '<div class="wrap">'+
  '<div class="card"><h2>🛑 活動中必須立即停止的訊號</h2>'+
  '<p class="muted">給護理師與復健師。心臟復健的安全性建立在「大家都認得停止條件」，不是建立在「不敢讓病人動」。</p>'+s+
  '<div class="callout danger">停止後：協助坐下、監測 HR／BP／SpO₂、通報負責護理師與醫師、記錄當下的活動強度與症狀。下一次活動的強度依此下修，而不是直接停掉所有活動。</div>'+
  '<p class="muted">以上為通用原則，實際門檻請依本院心臟復健作業規範與 JCS/JACR 2021 rehabilitation guideline 調整。</p></div>'+

  '<div class="card"><h2>📞 出院後家屬要打電話的六個情況</h2>'+
  '<p class="muted">請印出來貼在冰箱上，並在出院前用 teach-back 讓家屬複誦一次。</p>'+c+
  '<div class="callout good"><b>綠燈（正常）：</b>體重穩定、活動量跟平常一樣、能平躺睡覺。<br>'+
  '<b>黃燈（要聯絡）：</b>上列任一項出現 → 打電話問，不要自己加減藥。<br>'+
  '<b>紅燈（直接掛急診）：</b>休息時嚴重喘不過氣、胸痛、暈倒、意識改變。</div></div>'+

  '<div class="card"><h2>🗣️ Teach-back 三句話</h2>'+
  '<p>衛教有沒有做到，不是看有沒有發單張，是看病人／家屬能不能自己說出這三句：</p>'+
  '<div class="callout info">1.「我每天早上_____的時候量體重。」<br>2.「三天內胖_____公斤，我要打_____這支電話。」<br>3.「我下一次回診是_____月_____日。」</div></div>'+
  '</div>';
}

function viewFamily(){
  return '<div class="wrap">'+
  '<div class="card"><h2>👨‍👩‍👧 給家屬：住院這兩週會發生什麼</h2>'+
  '<p>心臟衰竭住院，不是「打針把水排掉就好」。這兩週醫療團隊其實同時在做五件事：</p>'+
  '<div class="callout info"><b>1. 把身體多餘的水排掉</b> — 所以要每天量體重、記錄尿量。<br>'+
  '<b>2. 把藥調到該有的劑量</b> — 心臟衰竭的藥需要慢慢往上加，這是能讓人活得更久的關鍵。<br>'+
  '<b>3. 讓長輩趕快下床動</b> — 躺越久肌肉掉越快，出院後會走不動。<br>'+
  '<b>4. 顧營養</b> — 吃不下的話，前面三件事都會打折。<br>'+
  '<b>5. 教會你們回家後怎麼照顧</b> — 這件事決定了會不會很快再住院。</div></div>'+

  '<div class="card"><h2>❓ 常見疑問</h2>'+
  '<h3>Q：長輩很喘，讓他下床走會不會有危險？</h3>'+
  '<p>在有評估、有監測的情況下進行是安全的，而且對恢復有幫助。研究顯示，因急性心衰竭住院的高齡衰弱病人接受早期、漸進式復健，3 個月後的體能（平衡、走路速度、坐站能力）明顯比沒做的人好 (REHAB-HF, NEJM 2021)。復健師會從床上運動開始，一步一步加，不會一開始就叫他走遠路。</p>'+
  '<h3>Q：我怕他跌倒，是不是躺著比較安全？</h3>'+
  '<p>躺著的風險其實更高。長期臥床會造成肌肉快速流失、平衡變差、出院後更容易跌倒，也更容易產生譫妄與壓瘡。安全的做法是「有人陪、有監測、循序漸進」，而不是不動。</p>'+
  '<h3>Q：為什麼藥一直加？之前吃得好好的。</h3>'+
  '<p>心臟衰竭的四類核心藥物需要加到能耐受的最大劑量才有完整效果。國際研究顯示，出院後積極把藥調上去併密集追蹤，可降低 180 天內再住院或死亡的風險（STRONG-HF：15.2% vs 23.3%）。歐洲心臟學會建議在出院後 6 週內完成，並於出院後 7–14 天內回診一次。</p>'+
  '<h3>Q：出院後還要繼續復健嗎？</h3>'+
  '<p>要。住院期間只是開始。門診心臟復健被證實可降低再住院率、明顯改善生活品質。如果交通不便，也有居家型方案，效果相近。</p></div>'+

  '<div class="card"><h2>📋 回家要帶走的三樣東西</h2>'+
  '<div class="callout good"><b>1. 完整用藥清單</b>（並把家裡舊的、重複的藥清掉）<br>'+
  '<b>2. 體重紀錄表</b>（每天同一時間、同一台磅秤）<br>'+
  '<b>3. 紅黃綠燈警示卡</b>（貼冰箱，全家人都要看過）</div></div>'+
  '</div>';
}

function viewQuiz(){
  if(S.qfin){
    return '<div class="wrap"><div class="card" style="text-align:center">'+
      '<h2>🎓 測驗完成</h2>'+
      '<p style="font-size:2.4rem;font-weight:700;color:var(--primary);margin:8px 0">'+S.qscore+' / '+QUIZ.length+'</p>'+
      '<p class="muted">'+(S.qscore>=5?"很好 — 尤其是統計解讀那幾題。":"建議回「解讀陷阱」分頁再看一次信賴區間那段。")+'</p>'+
      '<button class="btn" data-quiz="reset">重新測驗</button></div></div>';
  }
  var q=QUIZ[S.qi], opts="";
  q.options.forEach(function(o,k){
    var cls="opt";
    if(S.qsel!==null){ if(k===q.correct) cls+=" correct"; else if(k===S.qsel) cls+=" wrong"; }
    opts+='<button class="'+cls+'"'+(S.qsel!==null?" disabled":"")+' data-ans="'+k+'">'+o+'</button>';
  });
  var fb="";
  if(S.qsel!==null){
    fb='<div class="callout '+(S.qsel===q.correct?"good":"danger")+'"><b>'+
      (S.qsel===q.correct?"✅ 正確":"❌ 再想一次")+'</b><br>'+q.exp+
      '<div class="btnrow"><button class="btn sm" data-quiz="next">'+
      (S.qi<QUIZ.length-1?"下一題":"看結果")+'</button></div></div>';
  }
  return '<div class="wrap"><div class="card">'+
    '<div class="progressbar"><div style="width:'+((S.qi+1)/QUIZ.length*100)+'%"></div></div>'+
    '<p class="muted">第 '+(S.qi+1)+' 題 / 共 '+QUIZ.length+' 題</p>'+
    '<p style="font-weight:600;font-size:.96rem">'+q.q+'</p>'+opts+fb+'</div></div>';
}

function viewRefs(){
  var h="";
  REFS.forEach(function(r){
    h+='<div class="ref"><span class="reftag">'+r.tag+'</span>'+r.t+
      '<div class="muted" style="margin-top:4px">'+r.s+'</div>'+
      (r.u?'<a href="'+r.u+'" target="_blank" rel="noopener">'+r.u+'</a>':'')+'</div>';
  });
  return '<div class="wrap"><div class="card"><h2>📚 文獻佐證</h2>'+
    '<p class="muted">數值均以原始文獻／指引為準；使用前建議自行核對最新版本。</p>'+h+
    '<div class="callout warn"><b>方向確認：</b>本次海報為<b>觀察性、假說產生性</b>研究（海報自述 associative and hypothesis-generating），非隨機分派試驗，不可作為改變復健開立政策的依據。REHAB-HF 為 positive（主要指標 SPPB）但未 power 於臨床事件；STRONG-HF 為 positive；Cochrane 2023 ExCR 對死亡率為 neutral、對再住院與生活品質為 positive。</div>'+
    '</div></div>';
}

var VIEWS={home:viewHome,trap:viewTrap,pathway:viewPathway,safety:viewSafety,
           family:viewFamily,quiz:viewQuiz,refs:viewRefs};

function render(){
  var tabs="";
  TABS.forEach(function(t){
    tabs+='<button class="'+(S.tab===t[0]?"active":"")+'" data-go="'+t[0]+'">'+t[1]+'</button>';
  });
  document.getElementById("app").innerHTML =
  '<div class="hero"><h1>心衰竭 14 天整合照護 Pathway<br>— Pathway × 心臟復健，該怎麼讀這份資料</h1>'+
  '<p class="sub">依 ESC Congress 2026 moderated poster 與現行指引整理｜病房護理師・復健師・家屬適用</p>'+
  '<div class="tagrow"><span class="tag">心臟衰竭整合照護</span><span class="tag">心臟復健</span>'+
  '<span class="tag">GDMT</span><span class="tag">臨床路徑</span></div></div>'+
  '<nav class="tabs">'+tabs+'</nav>'+
  VIEWS[S.tab]()+
  '<footer class="sig">讀書會共筆整理人<br><b>謝慕揚 醫師 MD, PhD, FESC</b><br>心臟衰竭整合照護與心臟復健'+
  '<div class="disc">・本內容為讀書會共筆整理，未必涵蓋所有相關文獻<br>'+
  '・僅供學術與教育用途，不代表任何單位之官方立場<br>'+
  '・本內容未涉及任何利益衝突<br>'+
  '・checklist 為教學用途，實際執行依主治醫師醫囑與院內規範</div></footer>'+
  '<div class="fab"><button data-act="share">🔗 分享</button>'+
  '<button class="alt" data-act="print">🖨 列印／存 PDF</button></div>';
}

/* ============ 事件 ============ */

document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-go],[data-group],[data-role],[data-day],[data-chk],[data-ans],[data-quiz],[data-act]") : null;
  if(!el) return;

  if(el.hasAttribute("data-go")){ S.tab=el.getAttribute("data-go"); render(); window.scrollTo(0,0); return; }
  if(el.hasAttribute("data-group")){ S.group=el.getAttribute("data-group"); render(); return; }
  if(el.hasAttribute("data-role")){ S.role=el.getAttribute("data-role"); render(); return; }
  if(el.hasAttribute("data-day")){ var d=el.getAttribute("data-day"); S.openDay=(S.openDay===d?"":d); render(); return; }
  if(el.hasAttribute("data-chk")){ var k=el.getAttribute("data-chk"); S.done[k]=!S.done[k]; persist(); render(); return; }
  if(el.hasAttribute("data-ans")){
    if(S.qsel!==null) return;
    S.qsel=parseInt(el.getAttribute("data-ans"),10);
    if(S.qsel===QUIZ[S.qi].correct) S.qscore++;
    render(); return;
  }
  if(el.hasAttribute("data-quiz")){
    var a=el.getAttribute("data-quiz");
    if(a==="reset"){ S.qi=0;S.qsel=null;S.qscore=0;S.qfin=false; }
    else if(S.qi<QUIZ.length-1){ S.qi++; S.qsel=null; }
    else { S.qfin=true; }
    render(); window.scrollTo(0,0); return;
  }
  if(el.hasAttribute("data-act")){
    var act=el.getAttribute("data-act");
    if(act==="print"){ window.print(); return; }
    var txt="心衰竭 14 天整合照護 Pathway 教學（讀書會共筆整理）";
    if(navigator.share){ navigator.share({title:txt,text:txt,url:location.href}).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(location.href).then(function(){alert("連結已複製");},function(){}); }
    else { alert("請直接分享這個 HTML 檔案"); }
    return;
  }
});

render();
</script>
