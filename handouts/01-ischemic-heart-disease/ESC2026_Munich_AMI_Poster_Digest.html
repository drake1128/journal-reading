<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ESC 2026 Munich — 急性心肌梗塞海報導讀</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#c0392b; --accent-light:#e74c3c;
  --success:#27ae60; --warning:#f39c12; --info:#2980b9; --purple:#6c5ce7;
  --bg-cream:#faf8f5; --bg-card:#ffffff; --text-dark:#2c3e50; --text-muted:#7f8c8d;
  --border:#e6e9ec; --shadow:0 4px 20px rgba(0,0,0,.08);
}
:root.dark-theme{
  --bg-cream:#141b26; --bg-card:#1c2634; --text-dark:#e8eaed; --text-muted:#9aa5b1;
  --border:#2d3748; --shadow:0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  background:var(--bg-cream);color:var(--text-dark);line-height:1.75;font-size:15.5px;}
#root{max-width:820px;margin:0 auto;}
.app{padding:0 14px 96px;padding-bottom:calc(96px + env(safe-area-inset-bottom));}

/* Header */
.hdr{background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;margin:0 -14px 16px;padding:20px 18px 18px;border-radius:0 0 20px 20px;}
.hdr .tag{display:inline-block;background:rgba(255,255,255,.18);padding:3px 10px;
  border-radius:20px;font-size:11.5px;letter-spacing:.4px;margin-bottom:8px;}
.hdr h1{margin:0 0 4px;font-size:20px;font-weight:700;line-height:1.4;}
.hdr p{margin:0;font-size:12.5px;opacity:.88;}
.theme-btn{position:absolute;right:20px;top:20px;background:rgba(255,255,255,.2);border:0;
  color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;}
.hdr-wrap{position:relative;}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  z-index:50;box-shadow:0 -2px 14px rgba(0,0,0,.06);}
.nav button{flex:1;background:none;border:0;color:var(--text-muted);font-size:10.5px;
  font-family:inherit;padding:6px 2px;min-height:48px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;border-radius:10px;}
.nav button.on{color:var(--accent);font-weight:600;background:rgba(192,57,43,.07);}
.nav .ico{font-size:17px;line-height:1;}

/* Cards */
.card{background:var(--bg-card);border-radius:14px;padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);border:1px solid var(--border);}
.card h2{margin:0 0 10px;font-size:17px;color:var(--primary);font-weight:700;
  display:flex;align-items:center;gap:8px;}
:root.dark-theme .card h2{color:#7fb2e8;}
.card h3{margin:16px 0 8px;font-size:15px;color:var(--accent);font-weight:600;}
.card p{margin:0 0 10px;}
.sub{font-size:12.5px;color:var(--text-muted);margin-top:-4px;margin-bottom:12px;}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;
  background:var(--border);color:var(--text-dark);margin-right:6px;font-weight:500;}
.badge.red{background:rgba(192,57,43,.12);color:var(--accent);}
.badge.green{background:rgba(39,174,96,.14);color:var(--success);}
.badge.blue{background:rgba(41,128,185,.14);color:var(--info);}
.badge.amber{background:rgba(243,156,18,.16);color:#b9770e;}
.badge.purple{background:rgba(108,92,231,.14);color:var(--purple);}
:root.dark-theme .badge.amber{color:#e0a94a;}
:root.dark-theme .badge.purple{color:#a29bfe;}

.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px;}
.kv:last-child{border-bottom:0;}
.kv b{font-weight:600;color:var(--primary);white-space:nowrap;}
:root.dark-theme .kv b{color:#7fb2e8;}

.note{border-left:4px solid var(--info);background:rgba(41,128,185,.07);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.8px;}
.warn{border-left:4px solid var(--warning);background:rgba(243,156,18,.09);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.8px;}
.danger{border-left:4px solid var(--accent);background:rgba(192,57,43,.07);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.8px;}
.good{border-left:4px solid var(--success);background:rgba(39,174,96,.08);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.8px;}
.note b,.warn b,.danger b,.good b{display:block;margin-bottom:3px;}

table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 4px;}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--border);}
th:first-child,td:first-child{text-align:left;}
th{background:rgba(30,58,95,.06);color:var(--primary);font-weight:600;font-size:12.5px;}
:root.dark-theme th{background:rgba(127,178,232,.12);color:#7fb2e8;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
td.num{font-variant-numeric:tabular-nums;}
td.win{color:var(--accent);font-weight:600;}
:root.dark-theme td.win{color:#e88b80;}
tr.grp td{background:rgba(30,58,95,.05);font-weight:600;font-size:12px;color:var(--text-muted);text-align:left;}
:root.dark-theme tr.grp td{background:rgba(127,178,232,.08);}

/* Steps */
.step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);}
.step:last-child{border-bottom:0;}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px;}
.step .b{flex:1;}
.step .b strong{display:block;font-size:14.5px;margin-bottom:2px;}
.step .b span{font-size:13.5px;color:var(--text-muted);display:block;}

/* Stat strip */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
.stat{flex:1 1 96px;background:var(--bg-cream);border:1px solid var(--border);
  border-radius:11px;padding:9px 10px;}
.stat .v{font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3;}
:root.dark-theme .stat .v{color:#e88b80;}
.stat .k{font-size:11px;color:var(--text-muted);line-height:1.5;display:block;margin-top:1px;}

/* Accordion */
.acc{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--bg-card);}
.acc>button{width:100%;text-align:left;background:none;border:0;font-family:inherit;
  font-size:14.5px;font-weight:600;color:var(--text-dark);padding:13px 14px;min-height:48px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
.acc .body{padding:0 14px 14px;font-size:14px;border-top:1px solid var(--border);padding-top:12px;}
.acc .arrow{color:var(--accent);font-size:13px;}

/* Poster card */
.pc{background:var(--bg-card);border-radius:14px;margin-bottom:14px;box-shadow:var(--shadow);
  border:1px solid var(--border);overflow:hidden;}
.pc .top{padding:14px 16px 12px;border-top:4px solid var(--accent);}
.pc.ai .top{border-top-color:var(--info);}
.pc.drug .top{border-top-color:var(--warning);}
.pc.mcs .top{border-top-color:var(--accent);}
.pc.meta .top{border-top-color:var(--purple);}
.pc .idx{font-size:11.5px;color:var(--text-muted);font-weight:600;letter-spacing:.5px;}
.pc h3{margin:5px 0 6px;font-size:15.5px;font-weight:700;line-height:1.5;color:var(--primary);}
:root.dark-theme .pc h3{color:#7fb2e8;}
.pc .en{font-size:12.5px;color:var(--text-muted);line-height:1.55;margin:0 0 8px;font-style:italic;}
.pc .aff{font-size:12px;color:var(--text-muted);margin:0;}
.pc .verdict{background:var(--bg-cream);border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);padding:12px 16px;font-size:14.2px;}
.pc .verdict .lbl{display:block;font-size:10.5px;letter-spacing:1px;color:var(--text-muted);
  font-weight:600;margin-bottom:4px;}
.pc .verdict b{color:var(--accent);}
:root.dark-theme .pc .verdict b{color:#e88b80;}
.pc .inner{padding:14px 16px 16px;}
.pc h4{margin:14px 0 7px;font-size:14px;font-weight:700;color:var(--accent);
  display:flex;align-items:center;gap:6px;}
:root.dark-theme .pc h4{color:#e88b80;}
.pc h4:first-child{margin-top:0;}

ul.tight{margin:6px 0 6px 2px;padding-left:18px;}
ul.tight li{margin-bottom:6px;font-size:14px;}
.enw{color:var(--text-muted);font-size:.92em;}

/* Quiz */
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;
  background:var(--bg-cream);border:1.5px solid var(--border);border-radius:11px;
  font-family:inherit;font-size:14px;color:var(--text-dark);min-height:48px;cursor:pointer;}
.opt.correct{background:rgba(39,174,96,.14);border-color:var(--success);}
.opt.wrong{background:rgba(192,57,43,.1);border-color:var(--accent);}
.btn{background:var(--primary);color:#fff;border:0;border-radius:11px;padding:12px 18px;
  font-family:inherit;font-size:14.5px;font-weight:600;min-height:48px;cursor:pointer;width:100%;}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}

svg{max-width:100%;height:auto;display:block;}
.foot{font-size:12px;color:var(--text-muted);text-align:center;padding:8px 4px 0;line-height:1.9;}
.foot b{color:var(--text-dark);display:block;font-size:13px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

/* ============ 導覽 ============ */
const NAV = [
  {id:'home', ico:'🏠', label:'Take Home'},
  {id:'ai',   ico:'🤖', label:'AI 判讀'},
  {id:'drug', ico:'💊', label:'藥物'},
  {id:'mcs',  ico:'⚙️', label:'機械支持'},
  {id:'meta', ico:'📚', label:'統合分析'},
  {id:'read', ico:'🔍', label:'怎麼讀'},
  {id:'quiz', ico:'✏️', label:'測驗'},
];

/* ============ 共用元件 ============ */
const Stats = ({items}) => (
  <div className="stats">
    {items.map((s,i)=>(
      <div className="stat" key={i}>
        <div className="v">{s[0]}</div>
        <span className="k" dangerouslySetInnerHTML={{__html:s[1]}}/>
      </div>
    ))}
  </div>
);

const Tbl = ({head, rows}) => (
  <div className="tbl-wrap">
    <table>
      <thead><tr>{head.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
      <tbody>
        {rows.map((r,i)=>{
          if(r.grp) return <tr className="grp" key={i}><td colSpan={head.length}>{r.grp}</td></tr>;
          return (
            <tr key={i}>
              {r.map((c,j)=>(
                <td key={j} className={(j>0?'num ':'')+(r.win&&j===0?'win':'')}>{c}</td>
              ))}
            </tr>
          );
        })}
      </tbody>
    </table>
  </div>
);

const Steps = ({items}) => (
  <div>
    {items.map((s,i)=>(
      <div className="step" key={i}>
        <div className="n">{i+1}</div>
        <div className="b"><strong>{s[0]}</strong><span dangerouslySetInnerHTML={{__html:s[1]}}/></div>
      </div>
    ))}
  </div>
);

const Poster = ({p}) => (
  <div className={'pc '+p.kind}>
    <div className="top">
      <div className="idx">POSTER {p.no} · {p.design}</div>
      <h3>{p.zh}</h3>
      <p className="en">{p.en}</p>
      <p className="aff">{p.aff}</p>
      <div style={{marginTop:'8px'}}>
        {p.tags.map((t,i)=><span className={'badge '+t[1]} key={i}>{t[0]}</span>)}
      </div>
    </div>
    <div className="verdict">
      <span className="lbl">一句話結論</span>
      <span dangerouslySetInnerHTML={{__html:p.verdict}}/>
    </div>
    <div className="inner">
      <Stats items={p.stats}/>

      <h4>背景缺口</h4>
      <p style={{fontSize:'14px',margin:0}} dangerouslySetInnerHTML={{__html:p.gap}}/>

      <h4>創新點</h4>
      <ul className="tight">
        {p.novel.map((n,i)=><li key={i} dangerouslySetInnerHTML={{__html:n}}/>)}
      </ul>

      <h4>研究方法</h4>
      <Steps items={p.methods}/>

      {p.table && <><h4>{p.table.title}</h4><Tbl head={p.table.head} rows={p.table.rows}/></>}
      {p.table2 && <><h4>{p.table2.title}</h4><Tbl head={p.table2.head} rows={p.table2.rows}/></>}

      {p.impl && <><h4>臨床意涵</h4>
        <div className="good" dangerouslySetInnerHTML={{__html:p.impl}}/></>}

      <div className="warn" dangerouslySetInnerHTML={{__html:'<b>讀者請注意</b>'+p.caveat}}/>
    </div>
  </div>
);

/* ============ 11 篇資料 ============ */

const P01 = {
  no:'01', kind:'drug', design:'傾向分數配對 · 真實世界',
  zh:'GLP-1 RA 對決 SGLT2i — AMI 術後心腎保護',
  en:'GLP-1 receptor agonists outperform SGLT2 inhibitors in cardiorenal protection following acute myocardial infarction treated with PCI: a large-scale propensity score-matched real-world analysis',
  aff:'I. Zahan 等 · Guy’s and St Thomas’ NHS Trust（英國）／Dhaka Medical College（孟加拉）／WVU Heart and Vascular Institute（美國）',
  tags:[['心肌保護藥物','amber'],['TriNetX','blue'],['配對後 n=3,504','blue']],
  verdict:'AMI 接受 PCI 後，<b>GLP-1 RA 在幾乎所有心腎終點都優於 SGLT2i</b>，且效果在術後 30 天就出現、維持到 1 年；一年全因死亡率也開始浮現差異（HR 0.70）。',
  stats:[['0.22','30 天急性心衰 HR<br>(0.16–0.32)'],['0.29','30 天全因住院 HR<br>(0.24–0.35)'],
         ['0.63','30 天 MACE HR<br>(0.53–0.74)'],['0.35','30 天 AKI HR<br>(0.24–0.50)'],
         ['0.70','1 年全因死亡 HR<br>(0.51–0.97)']],
  gap:'GLP-1 RA 與 SGLT2i 各自都有心腎保護證據，但<b>從來沒有頭對頭的隨機試驗</b>直接比較兩者，在「AMI 剛做完 PCI」這個高風險早期窗口更是空白。臨床上該先加哪一個，目前純靠推論。',
  novel:[
    '<b>切進沒人做過的比較</b>：不是各自對安慰劑，而是兩個新一代降糖藥的直接對決。',
    '<b>不限糖尿病病人</b>（irrespective of diabetes status），把兩藥當作心臟保護藥而非降糖藥來評估。',
    '<b>時間軸雙切點</b>：同時看 30 天與 1 年，證明 GLP-1 RA 的優勢是「早期就出現且能維持」，而不是長期才慢慢拉開。',
  ],
  methods:[
    ['資料來源','TriNetX US Collaborative Network 去識別化電子病歷（擷取至 2026 年 1 月），多中心回溯性世代。'],
    ['族群定義','成人 AMI（ICD-10: I21）且接受 PCI，事件後<i>新啟用</i>（new-user design）GLP-1 RA（semaglutide 或 tirzepatide，n=7,201）或 SGLT2i（dapagliflozin 或 empagliflozin，n=4,252）。新使用者設計可避免「已長期用藥者存活偏差」。'],
    ['配對','一對一貪婪最近鄰傾向分數配對（caliper 0.1），涵蓋<b>逾 50 個共變數</b>——人口學、共病、用藥、關鍵檢驗值，配對後各 1,752 人。配對後多數 SMD &lt; 0.10。'],
    ['統計','Kaplan–Meier + log-rank + Cox 比例風險模型，觀察期<i>自 PCI 後第 1 天起算</i>（排除術中／當日事件干擾），分別看 30 天與 1 年。'],
    ['終點','全因死亡、急性心衰、全因住院、再發心梗、中風、心房顫動、MACE、AKI、心跳停止共 9 項。'],
  ],
  table:{title:'GLP-1 RA vs SGLT2i（HR < 1 表示 GLP-1 RA 較佳）',
    head:['終點','30 天 HR','1 年 HR'],
    rows:[
      Object.assign(['急性心衰','0.22 (0.16–0.32)','0.42 (0.34–0.50)'],{win:1}),
      Object.assign(['全因住院','0.29 (0.24–0.35)','0.56 (0.50–0.63)'],{win:1}),
      Object.assign(['再發心肌梗塞','0.63 (0.53–0.75)','0.80 (0.71–0.90)'],{win:1}),
      Object.assign(['中風','0.59 (0.43–0.81)','0.80 (0.67–0.96)'],{win:1}),
      Object.assign(['心房顫動','0.57 (0.46–0.71)','0.80 (0.69–0.93)'],{win:1}),
      Object.assign(['MACE','0.63 (0.53–0.74)','0.79 (0.71–0.88)'],{win:1}),
      Object.assign(['急性腎損傷','0.35 (0.24–0.50)','0.53 (0.44–0.64)'],{win:1}),
      ['全因死亡','無顯著差異','0.70 (0.51–0.97)'],
      ['心跳停止','趨勢有利未顯著','0.65 (0.41–1.02)'],
    ]},
  impl:'效果量大到不太尋常（30 天心衰 HR 0.22 意味風險下降近八成），這既是最吸引人之處也是最該保留的地方。合理讀法是：<b>它提出一個值得用 RCT 驗證的假說</b> —— AMI 後早期啟用 GLP-1 RA 可能比 SGLT2i 帶來更快的心衰與腎損傷保護，而不是直接改變現行處方順序。',
  caveat:'回溯性 EHR 研究，殘餘干擾無法排除：選擇用 GLP-1 RA 的病人可能本來就比較「適合」（體重、腎功能、醫師偏好）。傾向分數只能平衡「有記錄的」變項。配對後每組僅 1,752 人卻得到極強效果量，需警惕 immortal time bias 與適應症干擾。',
};

const P02 = {
  no:'02', kind:'ai', design:'自監督預訓練 · 外部驗證',
  zh:'深度學習鑑別 Takotsubo 與前壁 AMI',
  en:'Deep learning-based differentiation of Takotsubo syndrome and anterior acute myocardial infarction using electrocardiograms',
  aff:'Eisuke Kagawa 等 · Hiroshima City Asa Hospital／Asa Medical Association Hospital（日本廣島）',
  tags:[['AI 心電圖','blue'],['MAE 自監督','purple'],['n=831 + 96','blue']],
  verdict:'只靠<b>一張心電圖影像</b>，深度學習集成模型就能把 Takotsubo 症候群與前壁 STEMI 分開，外部驗證 AUC 0.970、敏感度 0.950，且校準良好（ECE 0.025）。',
  stats:[['0.970','集成模型 AUC'],['0.984','AUPRC'],['0.950','敏感度'],['0.846','特異度'],['0.025','ECE 校準誤差']],
  gap:'Takotsubo 在心電圖上經常「長得像」前壁 STEMI，尤其在自發性再通或血管重建之後更難分辨。現行以規則為基礎的心電圖判讀準則在真實世界表現一直不理想，而誤判的代價是不必要的緊急導管或延誤的正確處置。',
  novel:[

  ];
  return (
    <div>
      <div className="card">
        <h2>🔍 怎麼讀這批海報</h2>
        <p className="sub">八個判讀重點 · 點開展看細節</p>
        <p style={{margin:0,fontSize:'14.2px'}}>會議海報的資訊密度高但方法學細節少，容易讀出過強的結論。以下八點是讀這批海報時最該先問的問題，也適用於一般的 AI 診斷研究與觀察性研究判讀。</p>
      </div>
      {items.map((it,i)=>(
        <div className="acc" key={i}>
          <button onClick={()=>setOpen(open===i?null:i)}>
            <span>{i+1}. {it[0]}</span>
            <span className="arrow">{open===i?'▲':'▼'}</span>
          </button>
          {open===i && <div className="body" dangerouslySetInnerHTML={{__html:it[1]}}/>}

      ))}
      <div className="note">
        <b>一句話</b>
        這 11 篇裡有 9 篇是回溯性或觀察性設計 —— 它們適合用來<b>形成假說與調整警覺度</b>，不適合單獨用來改變處置流程。

};

/* ============ 測驗 ============ */
const QUIZ = [
  {q:'第 08 篇 AI-ECG 在前瞻性多中心驗證中，敏感度 65.12%、特異度 95.07%。最合理的臨床定位是？',

   o:['GLP-1 RA 確實有極強的心臟保護作用','資料計算錯誤','殘餘干擾與 immortal time bias 等觀察性研究偏差',

  {q:'第 02 篇報告了 ECE 0.025 與 Brier Skill Score 0.712。這兩個指標告訴我們什麼 AUC 沒告訴我們的事？',
   o:['模型的運算速度','模型輸出的機率值本身是否可信（校準）','模型的訓練資料量','模型的外部泛化能力'],
   c:1, e:'AUC 只反映判別（discrimination）—— 模型能不能正確排序。校準（calibration）才回答「模型說 80% 時，實際是不是真的接近 80%」。ECE 越小越好；沒有報告校準的模型，其機率輸出不應直接當臨床信心度使用。'},

  {q:'第 10 篇使用 Fine–Gray 次分布風險模型分析心因死亡，主要理由是？',

const Quiz = () => {
  const [i,setI] = useState(0);
  const [pick,setPick] = useState(null);
  const [score,setScore] = useState(0);
  const [done,setDone] = useState(false);

  if(done){
    const pct = Math.round(score/QUIZ.length*100);
    return (
      <div className="card">
        <h2>✏️ 測驗結果</h2>
        <div style={{textAlign:'center',padding:'18px 0'}}>
          <div style={{fontSize:'42px',fontWeight:700,color:'var(--accent)'}}>{score} / {QUIZ.length}</div>
          <div style={{color:'var(--text-muted)',fontSize:'14px'}}>正確率 {pct}%</div>
        </div>
        <p style={{fontSize:'14px'}}>
          {pct>=80 ? '很好 —— 你已經掌握這批海報的方法學界線，可以放心拿去跟同事討論。'
           : pct>=50 ? '不錯 —— 建議再回「怎麼讀」分頁複習驗證階梯與偏差來源。'
           : '建議先讀「怎麼讀」分頁的八個判讀重點，再回來作答。'}
        </p>
        <button className="btn" onClick={()=>{setI(0);setPick(null);setScore(0);setDone(false);}}>再作一次</button>
      </div>
    );
  }

  const q = QUIZ[i];
  return (
    <div className="card">
      <h2>✏️ 自我測驗</h2>
      <p className="sub">第 {i+1} / {QUIZ.length} 題 · 目前 {score} 題正確</p>
      <p style={{fontWeight:600,fontSize:'15px'}}>{q.q}</p>
      {q.o.map((o,j)=>(
        <button key={j}
          className={'opt'+(pick===null?'':(j===q.c?' correct':(j===pick?' wrong':'')))}
          onClick={()=>{ if(pick===null){ setPick(j); if(j===q.c) setScore(score+1); } }}>
          {String.fromCharCode(65+j)}. {o}
        </button>
      ))}
      {pick!==null && (
        <>
          <div className={pick===q.c?'good':'danger'}>
            <b>{pick===q.c?'答對了':'再想一下'}</b>
            {q.e}
          </div>
          <button className="btn" onClick={()=>{
            if(i+1<QUIZ.length){ setI(i+1); setPick(null); } else { setDone(true); }
          }}>{i+1<QUIZ.length?'下一題':'看結果'}</button>
        </>
      )}
    </div>
  );
};

      {tab==='read' && <ReadTab/>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
