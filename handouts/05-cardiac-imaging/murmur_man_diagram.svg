<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'Comic Sans MS','Chalkboard SE','Bradley Hand','Segoe Print',cursive">
  <defs>
    <!-- hand-drawn wobble filter -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- paper background -->
  <rect x="0" y="0" width="980" height="760" fill="#fdfbf4"/>
  <rect x="10" y="10" width="960" height="740" rx="14" fill="none" stroke="#d8d2bf" stroke-width="2" stroke-dasharray="2 7" filter="url(#rough)"/>

  <!-- title -->
  <text x="490" y="62" text-anchor="middle" font-size="42" fill="#2d3436" font-weight="bold">MURMUR MAN 🫀</text>
  <text x="490" y="98" text-anchor="middle" font-size="20" fill="#0072bc">一列排好：T &#8211; P &#8211; A &#8211; M</text>
  <text x="490" y="124" text-anchor="middle" font-size="15" fill="#7a7a6a">中間兩個＝半月瓣 (Pulmonic / Aortic)　外側兩個＝房室瓣 (Tricuspid / Mitral)</text>

  <!-- ============ SYSTOLE ROW ============ -->
  <g filter="url(#rough)">
    <rect x="40" y="150" width="900" height="238" rx="16" fill="#fff5f5" stroke="#ba181b" stroke-width="3"/>
  </g>
  <text x="70" y="188" font-size="26" fill="#ba181b" font-weight="bold">收縮期 SYSTOLE</text>
  <text x="380" y="188" font-size="17" fill="#c05621">規則：S 在中間、R 在兩邊　（半月瓣怕狹窄、房室瓣怕漏）</text>

  <!-- four valves systole: T P A M  ->  R S S M -->
  <g font-size="30" font-weight="bold" text-anchor="middle">
    <!-- T (side / AV) -->
    <g filter="url(#rough2)"><rect x="95" y="212" width="170" height="150" rx="14" fill="#ffffff" stroke="#ba181b" stroke-width="2.5"/></g>
    <text x="180" y="252" fill="#2d3436" font-size="34">T</text>
    <text x="180" y="252" fill="#7a7a6a" font-size="13" dy="20">三尖 (AV)</text>
    <text x="180" y="312" fill="#e67700" font-size="40">R</text>
    <text x="180" y="348" fill="#ba181b" font-size="24">→ TR</text>

    <!-- P (middle / semilunar) -->
    <g filter="url(#rough2)"><rect x="290" y="212" width="170" height="150" rx="14" fill="#fff0f0" stroke="#ba181b" stroke-width="2.5"/></g>
    <text x="375" y="252" fill="#2d3436" font-size="34">P</text>
    <text x="375" y="252" fill="#7a7a6a" font-size="13" dy="20">肺動脈 (半月)</text>
    <text x="375" y="312" fill="#0072bc" font-size="40">S</text>
    <text x="375" y="348" fill="#ba181b" font-size="24">→ PS</text>

    <!-- A (middle / semilunar) -->
    <g filter="url(#rough2)"><rect x="515" y="212" width="170" height="150" rx="14" fill="#fff0f0" stroke="#ba181b" stroke-width="2.5"/></g>
    <text x="600" y="252" fill="#2d3436" font-size="34">A</text>
    <text x="600" y="252" fill="#7a7a6a" font-size="13" dy="20">主動脈 (半月)</text>
    <text x="600" y="312" fill="#0072bc" font-size="40">S</text>
    <text x="600" y="348" fill="#ba181b" font-size="24">→ AS</text>

    <!-- M (side / AV) -->
    <g filter="url(#rough2)"><rect x="710" y="212" width="170" height="150" rx="14" fill="#ffffff" stroke="#ba181b" stroke-width="2.5"/></g>
    <text x="795" y="252" fill="#2d3436" font-size="34">M</text>
    <text x="795" y="252" fill="#7a7a6a" font-size="13" dy="20">二尖 (AV)</text>
    <text x="795" y="312" fill="#e67700" font-size="40">R</text>
    <text x="795" y="348" fill="#ba181b" font-size="24">→ MR</text>
  </g>

  <!-- FLIP arrow -->
  <g filter="url(#rough)">
    <path d="M 470 400 q 40 30 0 60" fill="none" stroke="#555" stroke-width="3" marker-end="url(#none)"/>
  </g>
  <text x="560" y="438" text-anchor="middle" font-size="20" fill="#555">🔄 翻面！ FLIP</text>

  <!-- ============ DIASTOLE ROW ============ -->
  <g filter="url(#rough)">
    <rect x="40" y="470" width="900" height="238" rx="16" fill="#eef6fd" stroke="#0072bc" stroke-width="3"/>
  </g>
  <text x="70" y="508" font-size="26" fill="#0072bc" font-weight="bold">舒張期 DIASTOLE</text>
  <text x="380" y="508" font-size="17" fill="#2b6cb0">規則：完全相反 &#8212; R 在中間、S 在兩邊</text>

  <!-- four valves diastole: T P A M  ->  S R R S -->
  <g font-size="30" font-weight="bold" text-anchor="middle">
    <!-- T (side / AV) -->
    <g filter="url(#rough2)"><rect x="95" y="532" width="170" height="150" rx="14" fill="#ffffff" stroke="#0072bc" stroke-width="2.5"/></g>
    <text x="180" y="572" fill="#2d3436" font-size="34">T</text>
    <text x="180" y="572" fill="#7a7a6a" font-size="13" dy="20">三尖 (AV)</text>
    <text x="180" y="632" fill="#0072bc" font-size="40">S</text>
    <text x="180" y="668" fill="#0072bc" font-size="24">→ TS</text>

    <!-- P (middle / semilunar) -->
    <g filter="url(#rough2)"><rect x="290" y="532" width="170" height="150" rx="14" fill="#e3f0fb" stroke="#0072bc" stroke-width="2.5"/></g>
    <text x="375" y="572" fill="#2d3436" font-size="34">P</text>
    <text x="375" y="572" fill="#7a7a6a" font-size="13" dy="20">肺動脈 (半月)</text>
    <text x="375" y="632" fill="#e67700" font-size="40">R</text>
    <text x="375" y="668" fill="#0072bc" font-size="24">→ PR</text>

    <!-- A (middle / semilunar) -->
    <g filter="url(#rough2)"><rect x="515" y="532" width="170" height="150" rx="14" fill="#e3f0fb" stroke="#0072bc" stroke-width="2.5"/></g>
    <text x="600" y="572" fill="#2d3436" font-size="34">A</text>
    <text x="600" y="572" fill="#7a7a6a" font-size="13" dy="20">主動脈 (半月)</text>
    <text x="600" y="632" fill="#e67700" font-size="40">R</text>
    <text x="600" y="668" fill="#0072bc" font-size="24">→ AR</text>

    <!-- M (side / AV) -->
    <g filter="url(#rough2)"><rect x="710" y="532" width="170" height="150" rx="14" fill="#ffffff" stroke="#0072bc" stroke-width="2.5"/></g>
    <text x="795" y="572" fill="#2d3436" font-size="34">M</text>
    <text x="795" y="572" fill="#7a7a6a" font-size="13" dy="20">二尖 (AV)</text>
    <text x="795" y="632" fill="#0072bc" font-size="40">S</text>
    <text x="795" y="668" fill="#0072bc" font-size="24">→ MS</text>
  </g>

  <!-- footer -->
  <text x="490" y="738" text-anchor="middle" font-size="13" fill="#9a9a86">整理：謝慕揚 MD, PhD, FESC　·　concept: @avathepa "Murmur Man"　·　S = stenosis 狹窄，R = regurgitation 逆流</text>
</svg>
